  - id: S-060
    key: langchain-multi-agent
    title: "LangChain — Multi-agent"
    org: LangChain
    kind: framework-doc
    evidence: PRIMARY
    url: https://docs.langchain.com/oss/python/langchain/multi-agent
    published: 2026
    retrieved: 2026-10-03
    recheck_after: 2027-04-03
    supports: [AO-002, AO-006, AO-009]
    status: active
    quote: >-
      Not every complex task requires this approach — a single agent with the
      right (sometimes dynamic) tools and prompt can often achieve similar
      results.
    notes: >-
      The most recent primary-source pattern matrix found, and notably
      conservative. Contains the cleanest published cost-of-topology data: on an
      identical two-turn scenario, subagents cost 8 model calls against handoffs 5
      and router 6, because results flow back through the main agent. Rationale
      for multi-agent is stated as context management first, distributed
      development second, parallelisation third.

  - id: S-061
    key: langgraph-overview
    title: "LangGraph — Overview"
    org: LangChain
    kind: framework-doc
    evidence: PRIMARY
    url: https://docs.langchain.com/oss/python/langgraph/overview
    published: 2026
    retrieved: 2026-10-03
    recheck_after: 2027-04-03
    supports: [AO-012, AO-002]
    status: active
    quote: >-
      Fine-grained control to mix deterministic, hand-coded steps with LLM-driven
      agentic steps in the same graph. Parts of the logic are fully predictable
      and auditable while other parts are flexible and model-driven.
    notes: >-
      The clearest commercial statement of the pattern ADR-010 D1 reached on
      other grounds — a typed state graph with durable execution, checkpointers,
      interrupts for human-in-the-loop, and time travel. The graph is the shared
      state (blackboard topology, AO-002).

  - id: S-062
    key: microsoft-agent-framework
    title: "Microsoft Agent Framework — Overview"
    org: Microsoft
    kind: framework-doc
    evidence: PRIMARY
    url: https://learn.microsoft.com/en-us/agent-framework/overview/agent-framework-overview
    published: 2026
    retrieved: 2026-10-03
    recheck_after: 2027-04-03
    supports: [AO-001, AO-002, AO-003, AO-011]
    status: active
    quote: >-
      If you can write a function to handle the task, do that instead of using an
      AI agent.
    notes: >-
      Successor to AutoGen + Semantic Kernel. Carries the harness-agent concept
      (planning, todo tracking, context compaction, don't-ask-again tool approval)
      and a decision table that puts the deterministic-function default first.
      Independent convergence with ADR-010 D1.

  - id: S-063
    key: crewai-processes
    title: "crewAI — Processes"
    org: crewAI
    kind: framework-doc
