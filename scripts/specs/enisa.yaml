# ENISA advisory referential spec
# Source: ENISA publications: NIS2 implementing guidance (2024), 5G cybersecurity
# (2024), Cloud cybersecurity (2021), AI cybersecurity (2024), sectoral
# guidance for Energy, Health, Transport, Digital Infrastructure, Public
# Administration. https://www.enisa.europa.eu/topics/nis-directive
# Advisory only — ENISA is a non-normative advisory source. Each control
# paraphrases the ENISA guidance and crosswalks to NIST CSF 2.0 + SP 800-53 Rev 5.

framework: "ENISA Advisory"
framework_short: "ENISA"
directory: "ENISA"
version: "Advisory 2024 (NIS2 / 5G / Cloud / AI / Sectoral)"
source_url: "https://www.enisa.europa.eu/topics/nis-directive"
fetched_date: "2026-09-22"

families:
  # ---- NIS2 baseline (essential/important entities) ----
  - function: "NIS2"
    function_dir: "NIS2_BASELINE"
    category_name: "NIS2 Baseline (Essential / Important Entities)"
    practices:
      - id: "NIS2-21-1"
        text: "Apply the Art. 21(2)(a)–(j) closed-list of risk-management measures covering policies, incident handling, business continuity, supply chain, secure development, effectiveness assessment, cryptography, access control, asset management, and secure comms."
        informative_references: ["ENISA: NIS2 Implementing Guidance 2024", "NIS2 Directive Art. 21(2)(a)-(j)"]
        examples: ["Implement all 10 categories of Art. 21(2) measures"]
        objectives: ["Determine whether the 10 categories of Art. 21(2) measures are implemented."]
      - id: "NIS2-21-2"
        text: "Maintain up-to-date policies on risk analysis, incident handling, business continuity, and information system security that are approved at the management level."
        informative_references: ["ENISA: NIS2 Implementing Guidance 2024", "NIS2 Directive Art. 21(2)(a)"]
        examples: ["Approved security policy", "Annual review"]
        objectives: ["Determine whether security policies are approved."]
      - id: "NIS2-21-3"
        text: "Define roles, responsibilities, and authorities for information security across the entity, including senior management accountability."
        informative_references: ["ENISA: NIS2 Implementing Guidance 2024", "NIS2 Directive Art. 21(2)(b)"]
        examples: ["CISO appointment", "Role matrix"]
        objectives: ["Determine whether security roles are defined and assigned."]
      - id: "NIS2-21-4"
        text: "Implement state-of-the-art technical and organisational measures to ensure the security of network and information systems, including cryptographic controls where appropriate."
        informative_references: ["ENISA: NIS2 Implementing Guidance 2024", "NIS2 Directive Art. 21(2)(c),(e)"]
        examples: ["Cryptography standard", "SOTA review"]
        objectives: ["Determine whether SOTA controls are in place."]
      - id: "NIS2-21-5"
        text: "Establish and operate an incident handling process covering detection, response, and notification within statutory timelines (e.g., 24h early warning, 72h notification, 1-month final report)."
        informative_references: ["ENISA: NIS2 Implementing Guidance 2024", "NIS2 Directive Art. 23"]
        examples: ["24h early warning", "72h notification", "1-month final report"]
        objectives: ["Determine whether the entity reports incidents within NIS2 timelines."]
      - id: "NIS2-21-6"
        text: "Maintain business continuity and disaster recovery plans, including backup policies and recovery testing."
        informative_references: ["ENISA: NIS2 Implementing Guidance 2024", "NIS2 Directive Art. 21(2)(c)"]
        examples: ["BCP/DR plans", "Recovery testing"]
        objectives: ["Determine whether BCP/DR is in place and tested."]
      - id: "NIS2-21-7"
        text: "Manage supply-chain security by assessing supplier security, including the security of supplier-to-supplier relationships, and integrating security into procurement."
        informative_references: ["ENISA: NIS2 Implementing Guidance 2024", "NIS2 Directive Art. 21(2)(d)"]
        examples: ["Supplier risk assessments"]
        objectives: ["Determine whether supply-chain risks are managed."]
      - id: "NIS2-21-8"
        text: "Apply secure development procedures to in-house and outsourced systems, including vulnerability handling and secure coding."
        informative_references: ["ENISA: NIS2 Implementing Guidance 2024", "NIS2 Directive Art. 21(2)(e)"]
        examples: ["Secure SDLC"]
        objectives: ["Determine whether secure development is applied."]
      - id: "NIS2-21-9"
        text: "Assess the effectiveness of cybersecurity risk-management measures periodically (audits, tests)."
        informative_references: ["ENISA: NIS2 Implementing Guidance 2024", "NIS2 Directive Art. 21(2)(f)"]
        examples: ["Effectiveness assessments"]
        objectives: ["Determine whether measures are periodically assessed."]
      - id: "NIS2-21-10"
        text: "Provide basic cyber hygiene and security awareness training to all personnel, with role-based training where appropriate."
        informative_references: ["ENISA: NIS2 Implementing Guidance 2024", "NIS2 Directive Art. 21(2)(g)"]
        examples: ["Cyber hygiene training"]
        objectives: ["Determine whether training is provided."]
      - id: "NIS2-21-11"
        text: "Apply policies and procedures to assess the cybersecurity of supply-chain components (cryptography, secure comms, access control) when acquiring ICT products and services."
        informative_references: ["ENISA: NIS2 Implementing Guidance 2024", "NIS2 Directive Art. 21(2)(h),(i),(j)"]
        examples: ["Secure procurement process"]
        objectives: ["Determine whether acquisition policies include cybersecurity criteria."]

  # ---- Cloud (ENISA Cloud Cybersecurity) ----
  - function: "CLOUD"
    function_dir: "CLOUD"
    category_name: "Cloud Cybersecurity"
    practices:
      - id: "CLOUD-1"
        text: "Apply shared-responsibility model: the cloud customer retains responsibility for data, identity, and access; the provider for infrastructure, host, and physical."
        informative_references: ["ENISA: Cloud Cybersecurity 2021", "NIST SP 800-53 Rev 5: AC-03"]
        examples: ["Shared-responsibility matrix per service"]
        objectives: ["Determine whether the shared-responsibility split is documented."]
      - id: "CLOUD-2"
        text: "Use strong identity, authentication, and authorisation for cloud workloads, including federated identity where applicable."
        informative_references: ["ENISA: Cloud Cybersecurity 2021", "NIST SP 800-53 Rev 5: IA-02"]
        examples: ["Federated identity", "MFA", "Conditional access"]
        objectives: ["Determine whether strong identity is used in the cloud."]
      - id: "CLOUD-3"
        text: "Encrypt data at rest and in transit in cloud workloads with customer-managed keys where required by data classification."
        informative_references: ["ENISA: Cloud Cybersecurity 2021", "NIST SP 800-53 Rev 5: SC-28"]
        examples: ["BYOK/CMEK", "TLS everywhere"]
        objectives: ["Determine whether cloud data is encrypted with appropriate key management."]
      - id: "CLOUD-4"
        text: "Continuously monitor cloud workloads via CSPM and CWPP and remediate misconfigurations within SLAs."
        informative_references: ["ENISA: Cloud Cybersecurity 2021", "NIST SP 800-53 Rev 5: SI-04"]
        examples: ["CSPM", "CWPP"]
        objectives: ["Determine whether cloud posture is continuously monitored."]

  # ---- 5G Cybersecurity (ENISA 5G) ----
  - function: "5G"
    function_dir: "5G"
    category_name: "5G Cybersecurity"
    practices:
      - id: "5G-1"
        text: "Apply ENISA's 5G threat landscape mitigations: harden the 5G core, segment network slices, protect signalling, and verify supply chain of network equipment."
        informative_references: ["ENISA: 5G Cybersecurity 2024", "NIST SP 800-53 Rev 5: SC-32"]
        examples: ["Network slicing isolation", "Supplier SBOMs"]
        objectives: ["Determine whether 5G-specific mitigations are applied."]
      - id: "5G-2"
        text: "Protect signalling traffic and APIs against SS7, Diameter, and HTTP/2 vulnerabilities."
        informative_references: ["ENISA: 5G Cybersecurity 2024", "NIST SP 800-53 Rev 5: SC-08"]
        examples: ["Signalling firewalls", "API authN/Z"]
        objectives: ["Determine whether signalling is protected."]
      - id: "5G-3"
        text: "Monitor and audit 5G network elements for anomalies consistent with known 5G attack patterns."
        informative_references: ["ENISA: 5G Cybersecurity 2024", "NIST SP 800-53 Rev 5: SI-04"]
        examples: ["5G-aware IDS"]
        objectives: ["Determine whether 5G network elements are monitored."]

  # ---- AI Cybersecurity (ENISA AI) ----
  - function: "AI"
    function_dir: "AI"
    category_name: "AI Cybersecurity"
    practices:
      - id: "AI-1"
        text: "Identify and address AI-specific threats (prompt injection, training-data poisoning, model theft) in AI systems."
        informative_references: ["ENISA: AI Cybersecurity 2024", "NIST AI SSDF: PW.AI.1"]
        examples: ["Adversarial testing", "Data validation"]
        objectives: ["Determine whether AI-specific threats are addressed."]
      - id: "AI-2"
        text: "Implement provenance, integrity, and confidentiality controls for AI artefacts (datasets, weights, prompts)."
        informative_references: ["ENISA: AI Cybersecurity 2024", "NIST AI SSDF: PS.AI.1, PS.AI.2"]
        examples: ["Signed models", "Dataset provenance"]
        objectives: ["Determine whether AI artefacts are integrity-protected."]
      - id: "AI-3"
        text: "Monitor AI systems for adversarial behaviour, jailbreaks, and unintended outputs in production."
        informative_references: ["ENISA: AI Cybersecurity 2024", "NIST AI RMF 1.0: MANAGE-2.4"]
        examples: ["Output monitoring", "Red-team prompts"]
        objectives: ["Determine whether AI production is monitored."]

  # ---- Energy sector ----
  - function: "ENERGY"
    function_dir: "SECTOR_ENERGY"
    category_name: "Energy Sector"
    practices:
      - id: "ENERGY-1"
        text: "Apply OT/IT segmentation for power-grid and oil & gas operations with Purdue-model reference architecture."
        informative_references: ["ENISA: Energy Sector Guidance", "NIST SP 800-53 Rev 5: SC-32", "IEC 62443"]
        examples: ["DMZ between IT and OT", "Purdue levels"]
        objectives: ["Determine whether OT/IT segmentation is applied."]
      - id: "ENERGY-2"
        text: "Implement IEC 62443 zone-and-conduit controls for ICS in energy."
        informative_references: ["ENISA: Energy Sector Guidance", "IEC 62443-3-3"]
        examples: ["Zone definition", "Conduit controls"]
        objectives: ["Determine whether IEC 62443 is applied."]

  # ---- Health sector ----
  - function: "HEALTH"
    function_dir: "SECTOR_HEALTH"
    category_name: "Health Sector"
    practices:
      - id: "HEALTH-1"
        text: "Apply ENISA health-sector guidance on medical device cybersecurity including vulnerability disclosure, secure-by-default, and patch cadence."
        informative_references: ["ENISA: Health Sector Guidance", "MDCG 2019-16"]
        examples: ["Medical device SBOMs", "Patch SLAs"]
        objectives: ["Determine whether medical-device cybersecurity is addressed."]
      - id: "HEALTH-2"
        text: "Protect health data (special-category PII) with encryption, pseudonymisation, and access controls aligned with GDPR Art. 9."
        informative_references: ["ENISA: Health Sector Guidance", "GDPR Art. 9", "ISO/IEC 27701:2019 A.5.34.2.2"]
        examples: ["Health-data pseudonymisation"]
        objectives: ["Determine whether health data is protected to GDPR Art. 9 standard."]

  # ---- Transport sector ----
  - function: "TRANSPORT"
    function_dir: "SECTOR_TRANSPORT"
    category_name: "Transport Sector"
    practices:
      - id: "TRANSPORT-1"
        text: "Apply ENISA transport-sector guidance: protect operational technology in aviation, rail, road, and maritime with cyber-physical controls and supply-chain assurance."
        informative_references: ["ENISA: Transport Sector Guidance", "IEC 62443"]
        examples: ["Cyber-physical safeguards", "Supplier assurance"]
        objectives: ["Determine whether transport OT is secured."]

  # ---- Public Administration ----
  - function: "PUBADMIN"
    function_dir: "SECTOR_PUBADMIN"
    category_name: "Public Administration"
    practices:
      - id: "PUBADMIN-1"
        text: "Apply ENISA guidance for public administrations: identity assurance, secure public services, and cross-border cooperation."
        informative_references: ["ENISA: Public Administration Guidance", "eIDAS Regulation"]
        examples: ["eIDAS integration", "Secure e-government"]
        objectives: ["Determine whether e-government services follow ENISA PA guidance."]

  # ---- Digital Infrastructure ----
  - function: "DINF"
    function_dir: "SECTOR_DINF"
    category_name: "Digital Infrastructure"
    practices:
      - id: "DINF-1"
        text: "Apply ENISA guidance for digital infrastructure (IXPs, DNS, TLD, cloud providers, datacentres) including BGP/DNSSEC, DDoS mitigation, and peering security."
        informative_references: ["ENISA: Digital Infrastructure Guidance", "NIST SP 800-53 Rev 5: SC-08"]
        examples: ["BGP route filtering", "DNSSEC", "DDoS mitigation"]
        objectives: ["Determine whether digital-infrastructure hardening is applied."]