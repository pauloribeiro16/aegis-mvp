    status: active
    notes: >-
      The one eval tool whose provider matrix includes Ollama, which is why it
      is the relevant candidate if a CLI-based harness is ever wanted alongside
      the repo's hand-rolled tests. MIT licensed despite the OpenAI ownership.

  - id: S-076
    key: anthropic-define-success-criteria
    title: "Define success criteria and build evaluations"
    org: Anthropic
    kind: vendor-primary
    evidence: PRIMARY
    url: https://docs.anthropic.com/en/docs/test-and-evaluate/define-success
    published: 2026
    retrieved: 2026-10-03
    recheck_after: 2027-04-03
    supports: [PP-016, PP-005]
    status: active
    quote: >-
      The model should classify sentiments well
    notes: >-
      The bad-vs-good acceptance-criteria table, quoted above as the bad half. The
      good half specifies a metric, a threshold, a corpus size and a baseline
      delta. Four properties: Specific, Measurable, Achievable, Relevant. The doc
      also preconditions its own guidance on having a clear definition of success
      first, and states that not every failure is best solved by prompt
      engineering — sometimes a different model is the lever.

  - id: S-077
    key: husain-ai-product-needs-evals
    title: "Your AI Product Needs Evals"
    org: Hamel Husain
    kind: practitioner
    evidence: PRACTITIONER
    url: https://hamel.dev/blog/posts/evals/
    published: 2023
    retrieved: 2026-10-03
    recheck_after: 2027-10-03
    supports: [PP-016, PP-021]
    status: active
    quote: >-
      Unlike typical unit tests, you want to organize these assertions for use in
      places beyond unit tests, such as data cleaning and automatic retries
      (using the assertion error to course-correct) during model inference.
    notes: >-
      Opinion, but the most-cited practitioner argument on the subject, and the
      origin of the three-level eval ladder (unit / model-and-human / A-B, with
      decreasing cadence). The quoted sentence is the single highest-leverage
      design idea in this registry for AEGIS: one assertion library with three
      consumers — the test runner, the retry handler, and the data cleaner. Also
      the whack-a-mole failure analysis, where "prompts expanded into long and
      unwieldy forms" is listed as a symptom of plateau.

