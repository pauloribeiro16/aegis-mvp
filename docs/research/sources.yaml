  - id: S-173
    key: prior-review-kg-rag
    title: "Retrieval-Augmented Generation with Knowledge Graphs for Multi-hop QA"
    org: Bioinformatics (Oxford University Press)
    kind: prior-review
    evidence: PEER
    url: https://arxiv.org/abs/2311.17330
    published: 2023-11-29
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [PP-014, PP-015, KG-012, KG-036]
    status: active
    quote: >-
      the proposed method utilizes minimal graph schema for context extraction
      and uses embedding methods for context pruning. This optimization in
      context extraction results in more than 50% reduction in token consumption
      without compromising the accuracy
    notes: >-
      From the 2026-10-01 literature review, RE-READ on 2026-10-04 (Soman et
      al., Bioinformatics 40(7):btae560; the arXiv id is the locatable copy of
      the journal of record). Grounding prompts in a CURATED knowledge graph
      improves answers in a high-stakes domain: >50% token reduction with no
      accuracy loss, +71% for Llama-2-13b on a biomedical MCQ benchmark, with
      per-claim provenance. This is the load-bearing citation for KG-036
      (curation is the variable that matters, not graph-ness) and the exact
      counterpart to S-250, which builds the graph WITH an LLM and loses on
      answer accuracy. No head-to-head study isolating curation as the variable
      was found; the two are not commensurable -- see KG-036.

