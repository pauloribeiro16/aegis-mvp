      QA, not compliance, so it is illustrative of measurement practice rather
      than of retrieval behaviour.

  - id: S-259
    key: mcq-budget-leaderboard-instability
    title: "Same Ranking, Different Winner: How Scoring Targets Shape LLM Memory Benchmarks"
    org: MCQ authors
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2605.24060
    published: 2026-05-22
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-021, KG-025]
    status: active
    quote: >-
      switching only the credited target changes nDCG on 83.4--94.0 percent of
      shared queries, flips target orderings on Mem0 and MemoryOS transfer runs,
      and reverses parser-density recommendations.
    notes: >-
      The generalisable warning underneath KG-021 and KG-025: the choice of
      which derived form receives credit is itself a measurement decision with
      first-order effects on conclusions. Switching only that choice changed
      nDCG on 83-94% of shared queries and flipped orderings. For AEGIS this
