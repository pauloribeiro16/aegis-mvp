    retrieved: 2026-10-03
    recheck_after: 2027-11-21
    supports: [AO-008]
    status: active
    notes: >-
      466 questions; humans 92% versus GPT-4 with plugins at 15%. The gap is the
      reason agentic evaluation exists at all, and the reason none of these
      numbers transfer to a document-generation pipeline.

  - id: S-151
    key: agentbench
    title: "AgentBench: Evaluating LLMs as Agents"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2308.03688
