      control-anchored module is not the same as a citation to the module's
      prose, and which one is credited changes the measurement.

  # --- MCP and tool surface (KG-015, KG-019) ---

  - id: S-260
    key: mcp-spec-tools-2025-06-18
    title: "Model Context Protocol -- Tools (specification 2025-06-18)"
    org: MCP project
    kind: standard
    evidence: PRIMARY
    url: https://modelcontextprotocol.io/specification/2025-06-18/server/tools
    published: 2025-06-18
    retrieved: 2026-10-04
    recheck_after: 2027-06-18
    supports: [KG-015, KG-019]
    status: active
    quote: >-
      Tool Execution Errors: Reported in tool results with isError: true: API
      failures, Invalid input data, Business logic errors
    notes: >-
      The two-error-channel distinction that KG-019 depends on, and it is
      load-bearing for a graph query tool specifically. PROTOCOL errors (unknown
      tool, invalid arguments, server errors, JSON-RPC codes such as -32602) are
      OUT OF BAND; TOOL EXECUTION errors are IN BAND, carried as isError: true
      with a readable content payload. A malformed Cypher string is an execution
      error the model can read and self-correct from; a -32602 is a shape failure
      the model frequently retries verbatim. Also: tools/list is PAGINATED with
      a nextCursor cursor and notifications/tools/list_changed, which is how a
      server advertises schema changes; and the spec's own safety rule is that
      there SHOULD always be a human in the loop with the ability to deny tool
      invocations. The general spec entry is S-030.

  - id: S-261
    key: rest-to-mcp-empirical
    title: "From REST to MCP: An Empirical Study of API Wrapping and Automated Server Generation for LLM Agents"
    org: Mastouri, Ksontini, Barrak, Kessentini
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2507.16044
    published: 2025-07-21
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-015, KG-019]
    status: active
    quote: >-
      We find that 88.6% of servers are fully or partially REST-backed, with
      92% implementing tools as bare API wrappers. MCP servers expose a median
      of 19% of available operations
    notes: >-
      The first large-scale study of MCP server construction, and it measures
      the gap between the aspirational tool-design literature and practice.
      116 official servers analysed, 80 real OpenAPI contracts for the
      generation evaluation. Three numbers matter for a graph server: 92% are
      bare API wrappers, so "design semantically meaningful graph tools" is
      aspiration rather than description; the MEDIAN SERVER EXPOSES ONLY 19% OF
      AVAILABLE OPERATIONS, which is evidence FOR deliberate curation and
      AGAINST exposing a whole graph API; and automated spec generation succeeds
      for 76% of sampled tools, rising to 94.2% with automated repair, while
      filtering and regrouping cuts median tool count per API by one third --
      quantitative support for Anthropic's "fewer, better tools" advice (S-006).

  - id: S-262
    key: oracle-poisoning-kg
    title: "Oracle Poisoning: Corrupting Knowledge Graphs to Weaponise AI Agent Reasoning"
    org: Kereopa-Yorke, Diaz, Wright, Johnston, Del Rosario, Lynar
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2605.09822
    published: 2026-05-10
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-032]
    status: active
    quote: >-
      every tested model trusts poisoned data at 100% at moderate attacker
      sophistication(L2), with 269 valid trials (of 270) accepting fabricated
      security claims under directed queries.
    notes: >-
      The sharpest security evidence in the survey, and the only production-scale
      graph result found. An attack class distinct from prompt injection: the
      adversary corrupts the DATA the agent queries rather than its
      instructions. Nine models, three providers, N=30/model, against a
      PRODUCTION 42-MILLION-NODE CODE KNOWLEDGE GRAPH with real SDK tool use:
      100% trust at moderate attacker sophistication, 269 of 270 trials
      accepting fabricated security claims under directed queries. Two findings
      a graph-RAG practitioner must not skip. First, there is a DISCRETE
      ATTACKER-SKILL BREAK POINT where trust flips 0% to 100%. Second, DELIVERY
      MODE IS A FIRST-ORDER CONFOUND -- "GPT-5.1 shows 0% trust inline but 100%
      under both simulated and real agentic tool-use" -- so inline,
      prompt-based evaluation systematically UNDERSTATES the risk. Of five
      tested defences, only READ-ONLY ACCESS CONTROL eliminates the mutation
      vector; the other four are partial and model-dependent. For a pipeline
      whose corpus is version-controlled markdown with no write path from a
      model, the relevant conclusion is that the write path is the attack
      surface, and there is none.

  - id: S-263
    key: graphrag-maintenance-mode
    title: "graphrag (Microsoft GraphRAG open-source repository README)"
    org: Microsoft
    kind: framework-doc
    evidence: PRIMARY
    url: https://github.com/microsoft/graphrag
    published: 2026
    retrieved: 2026-10-04
    recheck_after: 2027-04-04
    supports: [KG-001, KG-030, KG-031]
    status: active
    quote: >-
      This project is largely in maintenance mode, and won't be accepting new
      PRs or implementing new features.
    notes: >-
      A first-order maintenance fact read from the repository on 2026-10-04
      (36.2k stars, 3.8k forks): the canonical GraphRAG implementation is
      self-declared MAINTENANCE MODE since its first release in July 2024,
      citing that frontier-model capabilities have changed and the research
      portfolio has diversified. The operational consequence for anyone
      depending on it: the docs require `graphrag init --root <path> --force`
      between minor version bumps and a migration notebook between major bumps,
      "which will overwrite your configuration and prompts" -- so PROMPT FILES
      ARE PART OF THE SYSTEM STATE and must be version-controlled, or the index
      is irreproducible. That is a concrete engineering requirement, not a
      research finding, and it is the one this repo's own design already meets
