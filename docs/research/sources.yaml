  - id: S-255
    key: beyond-memory-leaderboards-budget
    title: "Beyond Memory Leaderboards: Evaluating Scientific Memory as Budgeted Context Restoration"
    org: Beyond Memory Leaderboards authors
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2607.16848
    published: 2026-07-18
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-030, KG-031, KG-032]
    status: active
    quote: >-
      on PAIM Graphiti wins convincingly but uses 2.6M characters of retrieved
      context per query, and after controlling for retrieval budget the lead
      disappears.
    notes: >-
      The methodological correction that invalidates several headline results in
      the agent-memory literature, and the source of the most useful sentence in
      that whole area: the RETRIEVAL BUDGET IS A HIDDEN VARIABLE, so a score
      without its budget is uninterpretable. Across 8 memory systems on
      full-text scientific corpora, "the sparse-dense hybrid is the single most
      significant intervention: hybrid variants of Simple RAG, Mem0, and Theoria
      tie for the lead within 0.03 points" -- three architectures with wildly
      different memory designs reach the same score once BM25 is added, so the
      RETRIEVAL MODALITY mattered and the memory architecture did not. The paper
      is emphatic that the protocol must be reported in full: ingestion
      granularity, raw-text preservation, retrieval budget, retrieval modality,
      rubric audit, and judge choice all affect the outcome.

  - id: S-256
    key: selective-forgetting-graph-memory-negative
    title: "Selective Forgetting: A Graph-Based Memory Framework for Long-Term LLM Agents"
    org: Selective Forgetting authors
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2608.28978
    published: 2026-08-28
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-030, KG-032]
    status: active
    quote: >-
      On LongMemEval, the graph does not outperform a flat vector baseline at a
      matched candidate-generation budget of five retrieval roots: token F1 is
      0.417 against 0.468, and a paired bootstrap over 500 questions gives
      Delta = -0.050 (95% CI [-0.085, -0.016]).
    notes: >-
      The cleanest budget-controlled negative result for graph memory, with the
      confidence interval EXCLUDING ZERO -- this is a measured regression, not a
      null result. The diagnostic is the most useful sentence in the memory
      literature: the deficit concentrates on questions "that require recalling
      a specific prior assistant turn, where judged correctness falls from 0.911
      to 0.607, suggesting that decomposing a turn into entities discards the
      surface form these questions depend on". The generalisable form for
      AEGIS: A GRAPH IS A LOSSY COMPRESSOR FOR UTTERANCES WHOSE IDENTITY IS
      THEIR WORDING. If a query is about what a document literally says, a
      typed edge over extracted facts is the wrong store and verbatim text must
      remain reachable.

  - id: S-257
    key: calibration-hybrid-graph-vector-fusion
    title: "Calibrated Fusion for Heterogeneous Graph-Vector Retrieval in Multi-Hop QA"
    org: Calibrated Fusion authors
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2603.28886
    published: 2026-09-18
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-031]
    status: active
    quote: >-
      calibrated fusion improves held-out last-hop retrieval on HippoRAG2-style
      benchmarks: LastHop@10 increases from 69.1% to 71.0% on MuSiQue (15W/5L,
      p=0.041, n=514) and LastHop@5 from 51.7% to 53.6% on
      2WikiMultiHopQA (11W/2L, p=0.023, n=491)
    notes: >-
      The honest magnitude of the hybrid graph-plus-vector win, and the number
      KG-031 rests on: about +1.9pp, statistically significant, on a
      deliberately narrow last-hop metric. Compare against the +160%/+177% that
      S-258 claims for a different hybrid architecture -- the gap between those
      two figures is the reason KG-031 requires reading the baseline before
      believing any percentage improvement in this field. The mechanism
      generalises usefully: graph and vector scores have different distributions
      and are not directly comparable, so percentile-rank NORMALISING before
      fusion is what makes the combination work at all. Naive hybrids are
      miscalibrated, which is why they underperform.

  - id: S-258
    key: climate-hybrid-graphrag-claim
    title: "Beyond Vector Search: Comparing Classical RAG with Hybrid GraphRAG for Climate Science Q&A"
    org: Climate GraphRAG authors
    kind: preprint
    evidence: CONTESTED
    url: https://arxiv.org/abs/2608.28766
    published: 2026-08-28
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-031]
    status: active
    quote: >-
      we propose a hybrid architecture that integrates vector search with
      GraphRAG, Leiden community detection, and cross-encoder re-ranking,
      achieving gains of 160% in contextual relevance and 177% in contextual
      recall compared to classical RAG.
    notes: >-
      Registered specifically as a CONTESTED exemplar of KG-031's second
      anti-pattern, not as support for its conclusion. The claimed +160%/+177%
