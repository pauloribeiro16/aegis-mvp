  # --- Standards and machine-readable substrates (KG-001, KG-002) ---

  - id: S-183
    key: stix-2.1-spec
    title: "STIX Version 2.1"
    org: OASIS Cyber Threat Intelligence TC
    kind: standard
    evidence: PRIMARY
    url: https://docs.oasis-open.org/cti/stix/v2.1/os/stix-v2.1-os.html
    published: 2021-06-10
    retrieved: 2026-10-04
    recheck_after: never
    supports: [KG-001]
    status: active
    quote: >-
      Structured Threat Information Expression (STIX) is a language for
      expressing cyber threat and observable information. This document defines
      concepts that apply across all of STIX and defines the overall structure
      of the STIX language.
    notes: >-
      The only consensus machine-readable substrate in cyber threat
      intelligence, and the reference point for KG-001. Read in full: 19
      Domain Objects, 2 SROs (relationship, sighting), 18 SCOs. Every id is
      typed (`^<type>--<uuid>`). The important limitation for KG purposes: the
      `vulnerability` SDO is deliberately thin -- only `name` is required and
      there is NO first-class CVE-ID field, so linking a STIX vulnerability to
      a CVE number is a convention via external_references rather than a typed
      edge. The `attack-pattern` SDO, by contrast, does carry a first-class
      `aliases` array, which is the machine-readable hook for canonicalization
      (KG-004).

  - id: S-184
    key: stix-2.1-json-schemas
    title: "STIX 2.1 JSON schemas (sdos / sros / observables)"
    org: oasis-open
    kind: standard
    evidence: PRIMARY
    url: https://github.com/oasis-open/cti-stix2-json-schemas
    published: 2021
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-001]
    status: active
    quote: >-
      Attack Patterns are a type of TTP that describe ways that adversaries
      attempt to compromise targets.
    notes: >-
      The normative JSON substrate behind S-183, enumerated via the GitHub
      contents API: 19 SDO files, 2 SRO files, 18 SCO files. This is the
      artefact a KG builder actually loads. No publication date is carried on
      the repository root; the year is taken from the STIX 2.1 standard it
      implements.

  - id: S-185
    key: cve-json-record-format
    title: "CVE JSON record format"
    org: CVE Project
    kind: standard
    evidence: PRIMARY
    url: https://raw.githubusercontent.com/CVEProject/cve-schema/master/schema/CVE_Record_Format.json
    published: 2024
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-001, KG-005]
    status: active
    quote: >-
      cve-schema specifies the CVE JSON record format. This is the blueprint for
      a rich set of JSON data that can be submitted by CVE Numbering Authorities
      (CNAs) and Authorized Data Publishers (ADPs) to describe a CVE Record.
    notes: >-
      The top level uses `oneOf` with 45 named definitions rather than a flat
      `properties` map. The declared linkage hooks are `problemTypes` and
      `taxonomyMappings`, plus `configurations` carrying full CPE 2.3
      applicability. This is the mechanism by which CVE-to-CWE is an EDITABLE
      declared mapping, and therefore why the derived CVE-to-CAPEC-to-ATT&CK
      chain inherits every error in it (KG-005). The documentation URL
      https://cveproject.github.io/docs/schema/5.0.0/CVE_Record_Format returns
      HTTP 404; the raw schema on GitHub is the working artefact.

  - id: S-186
    key: mitre-attack-data-and-tools
    title: "ATT&CK Data and Tools -- ATT&CK in STIX"
    org: MITRE
    kind: vendor-primary
    evidence: PRIMARY
    url: https://attack.mitre.org/resources/attack-data-and-tools/
    published: 2024
    retrieved: 2026-10-04
    recheck_after: 2027-04-04
    supports: [KG-001, KG-005]
    status: active
    quote: >-
      STIX is a machine-readable format providing access to the ATT&CK knowledge
      base. It is the most granular representation of the ATT&CK data, and all
      other representations are derived from the STIX dataset.
    notes: >-
      MITRE's own statement that the STIX dataset is the single point of truth
      for ATT&CK, with every other representation derived. Read on 2026-10-04
      with Enterprise v19.2 as the current release. That claim is what makes a
      graph the primary representation rather than a derived view here -- the
      opposite of the AEGIS situation, where the markdown corpus is primary
      (see KG-036).

  - id: S-187
    key: mitre-attack-stix-bundle
    title: "MITRE ATT&CK STIX data -- enterprise-attack-19.2"
    org: MITRE
    kind: vendor-primary
    evidence: PRIMARY
    url: https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack-19.2.json
    published: 2026-08-05
    retrieved: 2026-10-04
    recheck_after: 2027-04-04
    supports: [KG-001, KG-005]
    status: active
    quote: >-
      MITRE ATT&CK is a globally-accessible knowledge base of adversary tactics
      and techniques based on real-world observations.
    notes: >-
      Downloaded and parsed in full on 2026-10-04 (53.8 MB): 26,086 objects,
      of which 21,262 (81%) are `relationship` objects against 858
      attack-patterns, 733 malware, 268 course-of-action, 191 intrusion-sets.
      The 81:19 edge-to-node ratio is the empirical statement that ATT&CK's
      analytic value lives in the edges, not the node list -- directly relevant
      to how AEGIS should think about its own traceability chain. Caveat for
      KG-002: ATT&CK's `x-mitre-*` custom types (analytic, detection-strategy,
      data-component, data-source, tactic) are NOT OASIS STIX SDOs, so a
      strictly-validating STIX 2.1 consumer will reject or ignore them.

  - id: S-188
    key: capec-1000-mechanisms
    title: "CAPEC-1000: Mechanisms of Attack"
    org: MITRE
    kind: vendor-primary
    evidence: PRIMARY
    url: https://capec.mitre.org/data/definitions/1000.html
    published: 2023
    retrieved: 2026-10-04
    recheck_after: 2027-04-04
    supports: [KG-005]
    status: active
    quote: >-
      This view organizes attack patterns hierarchically based on mechanisms that
      are frequently employed when exploiting a vulnerability. The categories
      that are members of this view represent the different techniques used to
      attack a system. They do not, however, represent the consequences or goals
      of the attacks.
    notes: >-
      CAPEC is an explicit hierarchy (Categories, Meta patterns, Abstract
      patterns, Patterns, Concrete patterns) and the page itself concedes
      multi-parent membership: "There exists the potential for some attack
      patterns to align with more than one category." That admission is the
      structural reason CAPEC fans out when used as the middle hop of a
      derivation chain -- see KG-005, where the measured fan-out is severe
      enough to invalidate the chain as a labelling mechanism.

  - id: S-189
    key: taxii-2.1-spec
    title: "TAXII Version 2.1"
    org: OASIS Cyber Threat Intelligence TC
    kind: standard
    evidence: PRIMARY
    url: https://docs.oasis-open.org/cti/taxii/v2.1/taxii-v2.1.html
    published: 2021-06-10
    retrieved: 2026-10-04
    recheck_after: never
    supports: [KG-001]
    status: active
    quote: >-
      TAXII Version 2.1 OASIS Standard 10 June 2021
    notes: >-
      The transport layer for sharing the graphs S-183/S-184 describe, published
      by the same technical committee on the same date. STIX and TAXII together
      are the one genuinely settled piece of infrastructure in the whole
      cyber-KG survey -- which makes their absence from the AEGIS baseline a
      deliberate, recorded choice rather than an oversight (see KG-002).

  - id: S-190
    key: first-epss-faq
    title: "Exploit Prediction Scoring System (EPSS) -- Frequently Asked Questions"
    org: FIRST
    kind: vendor-primary
    evidence: PRIMARY
    url: https://www.first.org/epss/faq
    published: 2026
    retrieved: 2026-10-04
    recheck_after: 2027-04-04
    supports: [KG-010]
    status: active
    quote: >-
      Why did my score change overnight? This is a very intentional design
      feature of EPSS. EPSS is a dynamic score that reacts to new information
      about the vulnerability, the community and even attacker behavior.
    notes: >-
      The best-documented drift discipline found in the entire survey, and the
      model for KG-010. Two findings that a KG builder routinely gets wrong:
      retraining is evidence-driven rather than calendar-driven ("Sustained
      drift toward the random baseline triggers a retraining cycle. In practice,
      retraining has occurred approximately annually"), and exploitation
      activity does NOT feed daily scores ("Exploitation data informs model
      training, not daily scoring") because direct evidence would leak activity
      EPSS lacks rights to publish. So a CVE-to-exploitation edge in a graph
      comes from signals, not from confirmed exploitation; CISA KEV is the
      confirmed-exploitation source.

  # --- KG construction: attack graphs (KG-002) ---

  - id: S-191
    key: mulval-usenix-2005
    title: "MulVAL: A Logic-based Network Security Analyzer"
    org: Ou, Govindavajhala, Appel (Princeton); USENIX Security 2005
    kind: preprint
    evidence: PEER
    url: https://www.usenix.org/legacy/events/sec05/tech/full_papers/ou/ou.pdf
    published: 2005
    retrieved: 2026-10-04
    recheck_after: never
    supports: [KG-002]
    status: active
    quote: >-
      The reasoning engine can handle networks with thousands of hosts in less
      than a minute.
    notes: >-
      The strongest quantitative evidence in the whole cyber-KG survey, and it
      is 21 years old. Read in full. Every input -- advisories via OVAL, host
      and network configuration as HACLs, principals, interaction rules -- is
      encoded as Datalog. Measured runtime: 0.08s at 1 host, 0.22s at 200,
      0.75s at 400, 3.85s at 1000, 15.8s at 2000. The reimplementation is ~1,000
      lines and the rules are vulnerability-definition-independent. Coverage:
      84% of Red Hat OVAL definitions (169 of 202), reasoning about privilege
      escalation and DoS but explicitly NOT confidentiality or integrity loss.
      The honest limitation the paper itself documents: hypothetical analysis
      degrades as n^k -- 12s at k=1, 273s at k=2 -- which is still the binding
      constraint on counterfactual attack-graph reasoning.

  - id: S-192
    key: attack-graph-steer-esorics-2024
    title: "It Is Time To Steer: A Scalable Framework for Analysis-driven Attack Graph Generation"
    org: Palma, Angelini; ESORICS 2024
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2312.16513
    published: 2023-12-27
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-002]
    status: active
    quote: >-
      Attack Graph (AG) represents the best-suited solution to support cyber risk
      assessment for multi-step attacks on computer networks, although their
      generation suffers from poor scalability due to their combinatorial
      complexity.
    notes: >-
      Read for the problem statement, which is sharper than the abstract's
      framing: the defect is not that generation cannot scale but that existing
      work permits analysis only AFTER generation completes, and long generation
      times mean the graph does not capture network dynamics. The failure mode
      is TEMPORAL, not combinatorial -- which matters because it reframes the
      scalability complaint that recurs in this literature. The proposed fix
      inverts the loop so the analyst queries during generation. CAVEAT: the
      abstract reports no absolute node counts or wall-clock numbers, and the
      full PDF was not read, so the "networks of unprecedented size" claim is
      unverified.

  # --- KG construction: CTI knowledge graphs (KG-003, KG-005) ---

  - id: S-193
    key: attackg-icdis-2022
    title: "AttacKG: Constructing Technique Knowledge Graph from Cyber Threat Intelligence Reports"
    org: Li, Zeng, Chen, Liang; ICDIS 2022
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2111.07093
    published: 2021-11-13
    retrieved: 2026-10-04
    recheck_after: 2027-11-04
    supports: [KG-003, KG-009]
    status: active
    quote: >-
      In our evaluation against 1,515 real-world CTI reports from diverse
      intelligence sources, AttacKG effectively identifies 28,262 attack
      techniques with 8,393 unique Indicators of Compromises (IoCs).
    notes: >-
      The pre-LLM reference point for CTI graph construction, and the baseline
      every later LLM system compares against. Reports F1 0.887 for
      attack-relevant entities, 0.896 for dependencies, 0.789 for techniques.
      The technique score sits ~10 points BELOW the entity score even in 2021
      with non-LLM extraction -- technique identification was already the hard
      sub-problem before LLMs, which is the evidence for KG-003's claim that
      grounding to a canonical taxonomy is the bottleneck rather than extraction.

  - id: S-194
    key: attackg-plus-llm
    title: "AttacKG+: Boosting Attack Knowledge Graph Construction with Large Language Models"
    org: Zhang, Du, Ma, Wang, Xie, Yang, Lu, Chang
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2405.04753
    published: 2024-05-08
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-003, KG-004]
    status: active
    quote: >-
      Our framework consists of four consecutive modules: rewriter, parser,
      identifier, and summarizer, each of which is implemented by instruction
      prompting and in-context learning empowered by LLMs.
    notes: >-
      The architectural contribution for KG-003 is the explicit separation of
      an `identifier` stage -- extraction and ATT&CK grounding are different
      jobs, and conflating them is the error. The schema revision is also
      notable: a cyber attack is represented as a temporally unfolding event
      whose steps each carry a behaviour graph, MITRE TTP labels, and a state
      summary. CAVEAT: the abstract publishes NO absolute F1 values, and at
      preprint time the code and datasets were unreleased, so this cannot be
      cited for a number.

  - id: S-195
    key: ctinexus-eurosp-2025
    title: "CTINexus: Automatic Cyber Threat Intelligence Knowledge Graph Construction Using Large Language Models"
    org: Cheng, Bajaber, Amanuel Tsegai, Song, Gao; Euro S&P 2025
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2410.21060
    published: 2024-10-28
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-003, KG-004]
    status: active
    quote: >-
      This is achieved through: (1) a carefully designed automatic prompt
      construction strategy with optimal demonstration retrieval for extracting
      a wide range of cybersecurity entities and relations; (2) a hierarchical
      entity alignment technique that canonicalizes the extracted knowledge and
      removes redundancy; (3) an long-distance relation prediction technique to
      further complete the CSKG with missing links.
    notes: >-
      The most-cited LLM CTI-KG construction paper in the survey. Its three
      declared modules map one-to-one onto the three hard problems in
      KG-003/KG-004/KG-007: extraction, canonicalization, completion. That the
      canonicalization stage is described as "hierarchical" is the
      same convergence S-199 and S-202 reach independently. Evaluated on 150
      real CTI reports from 10 platforms; no absolute F1 in the abstract. Its
      own evaluation protocol is the subject of the reproducibility critique in
      S-201 -- read the two together.

  - id: S-196
    key: multikg-attack-techniques
    title: "MultiKG: Multi-Source Threat Intelligence Aggregation for High-Quality Knowledge Graph Representation of Attack Techniques"
    org: Wang, Zhu, Xiong, Chen
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2411.08359
    published: 2024-11-13
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-003]
    status: active
    quote: >-
      We evaluated it using 1,015 real attack techniques and 9,006 attack
      intelligence entries from CTI reports.
    notes: >-
      The substantive contribution is the source set, not the model: existing
      methods rely on coarse unstructured CTI text, so MultiKG adds audit logs
      and static code analysis as finer-grained sources, processes each
      separately, then merges. Same lead author as AttacKG (S-193) -- the group
      that defined the task is the one extending its source set, which is a
      useful signal about where the field thinks the remaining headroom is.

  - id: S-197
    key: beacon-cross-source-kg
    title: "BEACON: Behavior-Anchored Cross-Source Knowledge Graph Construction for Cyber Threat Intelligence"
    org: Li, Cheng, Finnisa, Cui, Ding, Gao
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2608.28394
    published: 2026-08-28
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-003, KG-004]
    status: active
    quote: >-
      Our key insight is that attack behaviors, once mapped to MITRE ATT&CK (a
      standardized catalog of attack techniques), can anchor the rest of a
      report.
    notes: >-
      The most important construction insight in the survey, and the reason
      KG-003 reads the way it does. It reframes ATT&CK from a label into a JOIN
      KEY: attaching behaviours to ATT&CK anchors is what places every
      per-report graph in one canonical space, which is the precondition for
      cross-source consolidation. The problem it addresses is explicitly
      cross-source -- "the same threat is given unrelated names" -- with two
      stages: propose-then-verify extraction grounded in report evidence and
      official ATT&CK definitions "to suppress LLM misclassification and
      hallucination", then hierarchical merging using signals "in decreasing
      order of determinism". Releases the largest report-level CTI extraction
      set its authors know of (8,395 elements) and the first cross-source
      consolidation ground truth (3,487).

  - id: S-198
    key: cticonnect-kdd-2026
    title: "CTIConnect: A Benchmark for Retrieval-Augmented LLMs over Heterogeneous Cyber Threat Intelligence"
    org: Cheng, Liu, Li, Song, Gao; KDD 2026
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2510.11974
    published: 2025-10-13
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-004, KG-020, KG-022]
    status: active
    quote: >-
      We construct a unified evaluation environment integrating five
      heterogeneous CTI sources into 1,860 expert-verified QA pairs spanning
      nine tasks across three categories: Entity Linking, Multi-Document
      Synthesis, and Entity Attribution.
    notes: >-
      The benchmark that makes ENTITY LINKING a first-class task category
      rather than an assumed preprocessing step, which is the framing KG-004
      needs. Its findings are structural rather than model-specific: the
      cross-source semantic gap manifests differently per task category, and
      the bottleneck shifts between retrieval infrastructure and evidence
      utilization depending on the task. Two results worth carrying: domain
      strategies beat general-purpose retrieve-then-rerank and IRCoT, and
      findings hold under temporal splits spanning 2008-2025 -- the only
      temporal-split protocol found for CTI.

  - id: S-199
    key: cti-graphrag-apt28
    title: "Operationalizing Cyber Threat Intelligence with GraphRAG"
    org: Kabra, Paliwal, Hanawal
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2608.13050
    published: 2026-08-13
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-020, KG-037]
    status: active
    quote: >-
      In a detailed case study of one APT28 report, the GraphRAG plan kept
      firing at 100% of its detections after every IP address, domain, and file
      hash in the report was rotated, while the Naive RAG plan kept firing at
      only 29%.
    notes: >-
      A rare controlled comparison: only the retrieval step differs -- same
      report, same generation instructions, same model. Repeated across nine
      real CTI reports from four vendors. Two caveats the authors state in
      their own abstract qualify the headline: "even when the two systems end up
      close on total score", and "the wording of the generation prompt matters
      almost as much as the retrieval back-end itself" -- a direct
      prompt-confound warning that any single-number GraphRAG claim must carry.

  - id: S-200
    key: beyond-rag-cti-hamzic
    title: "Beyond RAG for Cyber Threat Intelligence: A Systematic Evaluation of Graph-Based and Agentic Retrieval"
    org: Hamzic, Skopik, Landauer, Wurzenberger, Rauber
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2604.11419
    published: 2026-04-13
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-020, KG-037]
    status: active
    quote: >-
      The hybrid graph-text approach improves answer quality by up to 35 percent
      on multi-hop questions compared to vector RAG, while maintaining more
      reliable performance than graph-only systems.
    notes: >-
      Four architectures compared on 3,300 CTI QA pairs: vector RAG, graph-only
      over a CTI KG, an agentic variant that REPAIRS failed graph queries, and
      hybrid graph+text. The agentic-repair arm is the tell -- it concedes that
      graph queries fail in practice, which is a realistic statement about the
      substrate and a direct input to KG-037. Graph-only is LESS reliable than
      hybrid, which is evidence against graph-only architectures in a
      real corpus.

  - id: S-201
    key: cve-to-attack-goldset-circl
    title: "Mapping CVEs to MITRE ATT&CK Techniques: A Curated Gold-Set Classifier and the Limits of LLM-Assisted Label Expansion"
    org: Bonhomme, Dulaunoy (CIRCL)
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2607.25572
    published: 2026-07-28
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-005, KG-023]
    status: active
    quote: >-
      Rather than relying on the CWE-to-CAPEC-to-ATT&CK derivation chain, whose
      table-expansion artifacts we quantify, we train a multi-label classifier
      on a curated gold dataset of 1,207 CVEs from expert MITRE Center for
      Threat-Informed Defense mappings.
    notes: >-
      The single most important negative result in the cyber-KG survey, and
      read in full. On CVE2CAPEC's CVE-2024 database (39,156 CVEs, 34,562
      labelled): 88.3% get at least one technique, but the MEDIAN labelled CVE
      receives 8 techniques, the mean 13.3, and 19% receive 20 or more. The
      most frequent derived technique, T1574.007, is attached to 53% of all
      labelled CVEs; T1574.006 to 53%, T1562.003 to 52%, T1134.001 to 49%. The
      authors' words: "No plausible reading of the vulnerability landscape has
      path-interception implicated in a majority of all disclosed CVEs; these
      frequencies are artifacts of table expansion." The concrete failure:
      CVE-2024-21732, a cross-site-scripting bug (CWE-79), is mapped through 48
      CAPECs to T1027 and T1574.006/007. Their supervised alternative roughly
      doubles recall@5 (0.322 to 0.686); the record figure is recall@5
      0.673 +/- 0.019, macro-F1 0.177 +/- 0.014. THE DIRECT LESSON FOR AEGIS:
      any edge derived by table expansion is an artefact of the tables, not a
      statement about the subject -- the same failure mode R2 guards against
      when it forbids re-deriving anchors.

  - id: S-202
    key: ranked-by-the-matcher
    title: "Ranked by the Matcher: A Reproducibility Audit of Knowledge Graph Extraction from Threat Reports"
    org: Hakim, Song
    kind: preprint
    evidence: CONTESTED
    url: https://arxiv.org/abs/2609.01671
    published: 2026-09-01
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-009, KG-023, KG-024]
    status: active
    quote: >-
      Re-scoring ten system outputs on shared documents under eight protocols
      reverses eleven of forty-five pairwise orderings; one fixed prediction set
      spans 0.16--0.70 F1.
    notes: >-
      The most important methodological source in the survey, and it reframes
      the whole of KG-009. Read in full. Of twelve inspected CTI extraction
      systems, the stated matching rule was reimplementable for only FIVE;
      three "named a family without fixing it, and four stated no criterion".
      Ten systems re-scored on 50 shared documents under eight protocols
      REVERSED 11 of 45 pairwise orderings; a fixed prediction set spans F1
      0.1577 (exact match) to 0.6994. Against a 378-item human-adjudicated set,
      no mechanical protocol agrees with reviewers more than 71% (range
      0.598-0.706); an LLM judge reaches 0.860. Corpus-pooled matching inflates
      true positives by 6.4%. Their framing is the one to reuse: "a reader
      comparing a published 0.16 against a published 0.70 would infer a
      different system, not a different set of three decisions." The mechanism
      matters for AEGIS specifically: their canonicalization module "scores
      identically to four decimals" with and without it on every backbone, yet
      the two prediction sets differ on 54 of 1,571 triples -- the metric
      cannot see canonicalization. Also finds the error profile shifts with
      input granularity (long documents dominated by confidence-lowering
      errors, short sentences by type misassignment).

  - id: S-203
    key: entity-matching-llms-edbt-2025
    title: "Entity Matching using Large Language Models"
    org: Peeters, Steiner, Bizer (Mannheim); EDBT 2025
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2310.11244
    published: 2023-10-17
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-004, KG-007]
    status: active
    quote: >-
      Our experiments show that the best LLMs require no or only a few training
      examples to perform comparably to PLMs that were fine-tuned using
      thousands of examples. LLM-based matchers further exhibit higher
      robustness to unseen entities.
    notes: >-
      The best current statement of general entity-matching SOTA, and the
      robustness-to-unseen-entities result is the one that transfers to a
      curated corpus: a newly added regulation entity is exactly the
      out-of-distribution case. Two practical findings: "there is no single
      best prompt but that the prompt needs to be tuned for each
      model/dataset combination" -- prompt tuning is not optional -- and GPT-4
      can emit structured explanations of wrong decisions, which makes
      error-class discovery automatable.

  - id: S-204
    key: match-compare-select-coling-2025
    title: "Match, Compare, or Select? An Investigation of Large Language Models for Entity Matching"
    org: Wang, Chen, Lin, Chen, Han, Wang, Zeng, Sun; COLING 2025
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2405.16884
    published: 2024-05-27
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-004, KG-007]
    status: active
    quote: >-
      current LLM-based entity matching approaches typically follow a binary
      matching paradigm that ignores the global consistency among record
      relationships.
    notes: >-
      The structural insight behind KG-007: PAIRWISE BINARY DECISIONS ARE THE
      WRONG PRIMITIVE, because an entity mentioned in three reports must be
      merged consistently, not by three independent binary calls. Across 8 ER
      datasets and 10 LLMs, the cluster-level SELECTING strategy wins. This
      converges independently with S-197 (signals in decreasing order of
      determinism) and S-195 (hierarchical entity alignment) -- three unrelated
      groups reaching hierarchical, most-deterministic-signal-first, cluster-
      aware merging.

  # --- KG construction: LLM-based extraction (KG-006, KG-007) ---

  - id: S-205
    key: kggen-mine-benchmark
    title: "KGGen: Extracting Knowledge Graphs from Plain Text with Language Models"
    org: Mo, Yu, Kazdan, Cabezas, Mpala, Yu, Cundy, Kanatsoulis, Koyejo (Stanford / AWS)
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2502.09956
    published: 2025-02-14
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-006, KG-023, KG-025]
    status: active
    quote: >-
      MINE-1: 100 articles, each accompanied by 15 facts that are known to be
      present in the article. KGGen scored 66.07% on average, significantly
      outperforming GraphRag 47.80% and OpenIE 29.84%.
    notes: >-
      The controlled comparison the field most needed, and unflattering to
      GraphRAG. Read in full. Releases MINE, the first benchmark for
      plain-text-to-KG, with an LLM inferability judge validated at 90.2%
      agreement and 0.80 correlation against manual scoring of 60 fact-KG
      pairs. The sharpest number in the survey is the triple-validity audit:
      from 100 hand-scored triples per method, KGGen 98% valid, OpenIE 55%,
      GraphRAG 0%. KGGen's mechanism for this is entity clustering, which at
      1M characters takes entities 4,602 to 3,573 and edges 3,180 to 2,448
      while IMPROVING the metrics. It also reports relation-type reuse of ~10x
      for KGGen versus ~2x for GraphRAG regardless of corpus size, concluding
      that "the relations in GraphRAG do not generalize as the corpus grows".
      Cost on 1M characters: 5.37M tokens, 551s.

  - id: S-206
    key: text2kgbench-iswc-2023
    title: "Text2KGBench: A Benchmark for Ontology-Driven Knowledge Graph Generation from Text"
    org: Mihindukulasooriya, Tiwari, Enguix, Lata (Ontotext); ISWC 2023
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2308.02357
    published: 2023-08-04
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-006, KG-023]
    status: active
    quote: >-
      We define seven evaluation metrics to measure fact extraction performance,
      ontology conformance, and hallucinations by LLMs.
    notes: >-
      The reference ontology-guided extraction benchmark, and the closest
      existing analogue to a published KG-extraction quality benchmark -- but
      NOT cyber-specific, and no cyber-domain equivalent was found. Two
      datasets: Wikidata-TekGen (10 ontologies, 13,474 sentences) and
      DBpedia-WebNLG (19 ontologies, 4,860 sentences). The task is explicitly
      constrained: extract facts conforming to a given ontology's concepts,
      relations and domain/range constraints AND faithful to the input. Its
      2023 verdict, that "there is room for improvement using both Semantic Web
      and Natural Language Processing techniques", is the statement that open
      13B models had not solved ontology-conformant extraction.

  - id: S-207
    key: gliner-ner
    title: "GLiNER: Generalist Model for Named Entity Recognition using Bidirectional Transformer"
    org: Zaratiana, Tomeh, Holat, Charnois (Sorbonne)
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2311.08526
    published: 2023-11-14
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-006]
    status: active
    quote: >-
      In this paper, we introduce a compact NER model trained to identify any
      type of entity. Leveraging a bidirectional transformer encoder, our model,
      GLiNER, facilitates parallel entity extraction, an advantage over the slow
      sequential token generation of LLMs.
    notes: >-
      The architecturally decisive property for KG-006: entity types are
      supplied AT INFERENCE TIME as natural-language labels, so a taxonomy can
      be swapped without retraining, and extraction runs in parallel rather than
      by sequential token generation. CAVEATS: the paper's claim to outperform
      ChatGPT and fine-tuned LLMs is table-relative with NO numbers in the
      abstract, and the arXiv comment field self-labels the work "in progress".
      Cite the successor (S-208) for numbers and do not treat the abstract claim
      as a result.

  - id: S-208
    key: gliner-multitask
    title: "GLiNER multi-task: Generalist Lightweight Model for Various Information Extraction Tasks"
    org: Stepanov, Shtopko (Aarhus)
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2406.12925
    published: 2024-06-14
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-006]
    status: active
    quote: >-
      Our model achieved SoTA performance on zero-shot NER benchmarks and
      leading performance on question-answering, summarization and relation
      extraction tasks.
    notes: >-
      Extends GLiNER to relation extraction and QA in one small encoder, so a
      non-LLM path can cover both halves of KG construction. Still no absolute
      numbers in the abstract -- the claims are table-relative. Independent
      group from the original authors.

  - id: S-209
    key: rebel-relation-extraction-emnlp-2021
    title: "REBEL: Relation Extraction By End-to-end Language generation"
    org: Huguet Cabot, Navigli (Sapienza); Findings of EMNLP 2021
    kind: preprint
    evidence: PEER
    url: https://aclanthology.org/2021.findings-emnlp.204/
    published: 2021-11
    retrieved: 2026-10-04
    recheck_after: never
    supports: [KG-006]
    status: active
    quote: >-
      we show how Relation Extraction can be simplified by expressing triplets as
      a sequence of text and we present REBEL, a seq2seq model based on BART
      that performs end-to-end relation extraction for more than 200 different
      relation types.
    notes: >-
      The reference seq2seq-RE formulation, motivated by exactly the failure
      mode every cyber paper reports -- multi-step pipelines "propagate errors
      or are limited to a small number of relation types". It is a GENERAL-
      domain model: its 200 relation types are Wikipedia-ish, so applying it to
      STIX/ATT&CK types requires fine-tuning. NAMING HAZARD: a 2026 preprint
      titled "REBEL: Hidden Knowledge Recovery via Evolutionary-Based
      Evaluation Loop" (arXiv 2602.06248) is unrelated.

  - id: S-210
    key: relik-acl-2024
    title: "ReLiK: Retrieve and LinK, Fast and Accurate Entity Linking and Relation Extraction on an Academic Budget"
    org: Orlando, Huguet Cabot, Barba, Navigli; Findings of ACL 2024
    kind: preprint
    evidence: PEER
    url: https://aclanthology.org/2024.findings-acl.839/
    published: 2024-08
    retrieved: 2026-10-04
    recheck_after: never
    supports: [KG-004, KG-006]
    status: active
    quote: >-
      we put forward an innovative input representation that incorporates the
      candidate entities or relations alongside the text, making it possible to
      link entities or extract relations in a single forward pass and to fully
      leverage pre-trained language models contextualization capabilities, in
      contrast with previous Retriever-Reader-based methods, which require a
      forward pass for each candidate.
    notes: >-
      The state-of-the-art framing for JOINTLY doing entity linking and
      relation extraction, which is precisely the two-stage problem in curated
      graph construction: extract, then ground to canonical ids. The
      retrieve-then-read structure maps cleanly onto a corpus design -- a
      retriever proposes candidate canonical ids, a reader aligns spans to them.
      Claims in-domain and out-of-domain SOTA "while using academic budget
      training and with up to 40x inference speed compared to competitors".

  - id: S-211
    key: anchor-schema-agnostic-cti
    title: "Schema-Agnostic Knowledge Graph Construction via Hybrid Ontology Discovery for Cyber Threat Intelligence (ANCHOR)"
    org: Kim, Kim, Kang, Kim, Lee
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2606.01208
    published: 2026-05-31
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-006, KG-007]
    status: active
    quote: >-
      This paper identifies three challenges: (i) schema-specific pipelines that
      require manual reconfiguration whenever the schema changes, (ii)
      prompt-based schema inclusion that fails to scale on large ontologies
      such as UCO, and (iii) reliance on enterprise LLM APIs that conflicts with
      privacy constraints when integrating sensitive internal incident data.
    notes: >-
      The cleanest published articulation of why schema-fixed pipelines break,
      which is the failure mode a corpus that must absorb new regulations will
      hit. Its three challenges are worth adopting verbatim as a design
      checklist for KG-006. The answer combines hybrid ontology discovery
      (search-and-navigate) with SHACL-based validation of type assignments,
      evaluated on UCO, STIX and MALOnt, with the practically important result
      that "ANCHOR with a local LLM closely matches enterprise LLM typing
      performance" -- the privacy-preserving path is not a large accuracy loss.

  - id: S-212
    key: tactic-kg-small-agents
    title: "TACTIC-KG: Toward Small Agent Teams for Cyber Threat Intelligence Knowledge Graph Construction"
    org: Bouchiha, Blanc
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2607.05001
    published: 2026-07-06
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-006]
    status: active
    quote: >-
      Recent approaches rely on monolithic Large Language Models (LLMs) to
      perform end-to-end extraction and completion, leading to high cost,
      limited controllability, and unstable performance.
    notes: >-
      Decomposes construction into specialised agents for extraction, typing,
      verification and curation -- the same four-stage decomposition S-194 and
      S-195 reach independently, arrived at by a third group. The quantitative
      claim is a direction rather than a number: with 3B-8B models, agent
      specialisation "consistently outperforms larger monolithic in-context-
      learning (ICL) baselines". No absolute F1 in the abstract. Directly
      relevant to a local-model pipeline, which is what AEGIS runs.

  - id: S-213
    key: ctikg-dnrti-stix2
    title: "Context-aware Entity-Relation Extraction for Threat Intelligence Knowledge Graphs"
    org: Mouiche, Saad
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2605.15904
    published: 2026-05-15
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-006]
    status: active
    quote: >-
      Experiments on the DNRTI-AUG-STIX2 dataset, which comprises 21 entity
      types aligned with STIX 2.1, demonstrate significant improvements over
      state-of-the-art baselines, yielding 3-4% gains in NER and up to 8% in RE
      performance, based on precision, recall, and F1-score.
    notes: >-
      Reports gains as DELTAS ONLY -- 3-4% NER, up to 8% RE -- with no
      absolute scores, which is itself a data point about the field's reporting
      hygiene (see S-201). The useful contribution is the artefact: DNRTI-
      AUG-STIX2, a released STIX-2.1-aligned dataset with 21 entity types.
      Method targets error propagation in pipeline architectures explicitly.

  - id: S-214
    key: kgv-paragraph-graph-credibility
    title: "KGV: Integrating Large Language Models with Knowledge Graphs for Cyber Threat Intelligence Credibility Assessment"
    org: Wu, Tang, Zhao, Li
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2408.08088
    published: 2024-08-15
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-006, KG-025]
    status: active
    quote: >-
      Compared to entity-based knowledge graphs (KGs) for equivalent-length
      texts, our structurally simple KG reduces node quantities by nearly
      two-thirds while boosting precision by 1.7% and cutting response time by
      46.7%.
    notes: >-
      A deliberate architectural dissent from the entity-centric assumption, and
      the only published MEASUREMENT of that assumption's cost anywhere in the
      survey: build paragraph-level semantic graphs where nodes are text
      segments linked by similarity, and measure the trade -- node count down
      nearly two-thirds, precision up 1.7%, response time down 46.7%, with a
      5.7% F1 gain on CTI-200. The lesson for KG-025 is that LESS structure can
      be the right answer, and the direction is measurable rather than
      aesthetic.

  # --- Model-driven graph query (KG-011 to KG-019) ---

  - id: S-215
    key: text-to-sparql-llms-knowledgenlp-2025
    title: "Investigating Large Language Models for Text-to-SPARQL Generation"
    org: D'Abramo, Zugarini, Torroni; KnowledgeNLP Workshop 2025
    kind: preprint
    evidence: PEER
    url: https://aclanthology.org/2025.knowledgenlp-1.5/
    published: 2025-05
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-011, KG-013, KG-014]
    status: active
    quote: >-
      In-Context Learning solutions achieve state-of-the-art on three out of
      four benchmarks... selecting the best demonstration from the nearest ones
      yields the best results, while the presence of entities and relations in
      the prompt is the most important factor.
    notes: >-
      The single most important source for KG-011 and KG-013, and the strongest
      quantitative evidence in the query thread. With open-weight backbones only
      (Mixtral 8x7B, Llama-3 70B, CodeLlama 70B) on QALD-9/10, LC-QUAD 2.0,
      QALD-9 DB: ZERO-SHOT F1 COLLAPSES -- a plain question with no entity or
      relation grounding scores 0.08 / 0.02 / 12.00 / 16.42 F1 across the four
      benchmarks. Dynamic few-shot with entity-and-relation-encoded
      demonstration retrieval (DFSL) reaches 76.59 / 57.69 / 85.45 / 75.14.
      Adding multi-query generation from beam hypotheses gives 84.45 / 62.20 /
      89.10 / 77.89, beating fine-tuned TSET-base on three of four. Ablation:
      removing relations from the retrieval key costs 16.12 F1 on QALD-9 DB;
      removing entities costs 18.52; both 25.55. This is the strongest
      available evidence that HOW the schema is presented dominates
      text-to-SPARQL performance.

  - id: S-216
    key: picard-emnlp-2021
    title: "PICARD: Parsing Incrementally for Constrained Auto-Regressive Decoding from Language Models"
    org: Scholak, Wang, Srivastava; EMNLP 2021
    kind: preprint
    evidence: PEER
    url: https://aclanthology.org/2021.emnlp-main.779/
    published: 2021-11
    retrieved: 2026-10-04
    recheck_after: never
    supports: [KG-012, KG-023]
    status: active
    quote: >-
      For T5-3B with PICARD, only 2% of the predictions are unusable. In these
      cases, beam search exited without finding a valid SQL prediction.
    notes: >-
      The canonical grammar-constrained decoding result, and the source of the
      validity-versus-correctness decomposition KG-012 turns on. Baseline T5-3B
      emits 12% of Spider dev queries that fail to execute at all; PICARD cuts
      that to 2%. The constrained model is simultaneously SOTA at 75.5 EM /
      79.3 EX. Latency cost is 2.5s to 3.1s per sample (beam 4, A100), about
      24%. The mechanism decomposes cleanly: incremental LEXING removes most
      of the invalid-query problem, while semantic GUARDS (e.g. an alias-alias
      pattern that must resolve to a real table) buy the extra accuracy. Useful
      precedent for the repo's own structured-output work -- note this closes
      the same gap as gap G1, from the decoding side rather than the
      post-hoc-parse side.

  - id: S-217
    key: spider2-iclr-2025
    title: "Spider 2.0: Evaluating Language Models on Real-World Enterprise Text-to-SQL Workflows"
    org: Lei et al. (HKU / Snowflake / Yale); ICLR 2025 Oral
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2411.07763
    published: 2024-11-18
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-011, KG-022]
    status: active
    quote: >-
      Notably, even the advanced LLMs-o1-preview solve only 17.1% of Spider 2.0
      tasks. For widely-used models like GPT-4o, the success rate is only 10.1%
      on Spider 2.0 tasks, compared to 86.6% on Spider 1.0, underscoring the
      substantial challenges posed by Spider 2.0.
    notes: >-
      The generalisation-gap number, and the reason KG-022 treats a coverage
      metric as more diagnostic than a QA score. 632 enterprise tasks over
      databases often exceeding 1,000 columns (up to over 3,000), SQL often
      over 100 lines. Even WITH ground-truth tables supplied, o1-preview reaches
      only 12.60% -- so roughly 7 points come from schema access and the rest is
      lost to exploration and multi-step reasoning. Transferable lesson: schema
      access is necessary and not sufficient, and benchmark difficulty
      determines what a score means.

  - id: S-218
    key: neo4j-text2cypher-retriever
    title: "Text2Cypher Retriever -- GraphRAG for Python"
    org: Neo4j
    kind: vendor-primary
    evidence: PRIMARY
    url: https://neo4j.com/docs/neo4j-graphrag-python/current/user_guide_rag.html
    published: 2026
    retrieved: 2026-10-04
    recheck_after: 2027-04-04
    supports: [KG-011, KG-015, KG-016]
    status: active
    quote: >-
      The LLM-generated query is not guaranteed to be syntactically correct. In
      case it can't be executed, a Text2CypherRetrievalError is raised.
    notes: >-
      The production reference design, and the evidence that the vendor's
      DEFAULT is to treat an invalid query as a hard error rather than a
      self-correction opportunity -- the caller must handle it. Design surface
      actually offered: an optional `neo4j_schema` string, an optional
      `examples` list of 'USER INPUT: ... QUERY: ...' pairs, separate LLM slots
      for cypher-generation and answer-generation, and no embedder required.
      The docs also expose a ToolsRetriever and VectorCypherRetriever /
      HybridCypherRetriever, so the vendor's own answer to the mode question is
      BOTH free-form Cypher and a tool-selection path -- KG-016.

  - id: S-219
    key: structgpt-emnlp-2023
    title: "StructGPT: A General Framework for Large Language Model to Reason over Structured Data"
    org: Jiang, Zhou, Dong, Ye, Zhao, Wen; EMNLP 2023
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2305.09645
    published: 2023-05-16
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-013, KG-015]
    status: active
    quote: >-
      Inspired by the study on tool augmentation for LLMs, we develop an
      Iterative Reading-then-Reasoning (IRR) approach for solving question
      answering tasks based on structured data, called StructGPT.
    notes: >-
      The invoking-linearization-generation loop behind KG-015: the model emits
      a Python-like API call against the structured store, the host executes it
      and returns a LINEARIZED projection for the next turn, and the loop
      repeats until an answer is emitted. On WebQSP zero-shot, lifts GPT-3.5 by
      +11.4% Hits@1. On MetaQA 1/2/3-hop 71.9/94.4/59.5 zero-shot, rising to
      71.0/97.1/93.5 with few-shot exemplars -- the 3-hop jump is the
      multi-hop payoff. The design point that matters for a controlled
      pipeline: the model never sees raw graph structure, only a linearized
      projection of what the interface returns.

  - id: S-220
    key: reasoning-on-graphs-iclr-2024
    title: "Reasoning on Graphs: Faithful and Interpretable Large Language Model Reasoning"
    org: Luo, Xie, Dong, Huang, Ma et al.; ICLR 2024
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2310.01061
    published: 2023-10-01
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-014, KG-015]
    status: active
    quote: >-
      RoG first generates relation paths grounded by KGs as faithful plans.
      These plans are then used to retrieve valid reasoning paths from KGs for
      LLMs to conduct faithful reasoning.
    notes: >-
      Planning-then-execute, and the strongest form of KG-014: the model emits a
      RELATION PATH in a special token format (<PATH> r1 <SEP> r2 <SEP>
      </PATH>), beam search top-3, and those relation names are used to query
      the graph for valid paths before any reasoning happens. That makes the
      plan falsifiable against the schema prior to execution. +22.3% Hits@1 /
      +14.4% F1 over UniKGQA on CWQ. The plug-and-play result is the
      transferable one: attaching the planner to FROZEN models lifted Hits@1
      by 8.5% (ChatGPT), 15.3% (Alpaca/LLaMA2), 119.3% (Flan-T5). NOTE: the
      paper's sentence names four models and gives three deltas -- an apparent
      typo, reported here verbatim rather than silently reconciled.

  - id: S-221
    key: think-on-graph-iclr-2024
    title: "Think-on-Graph: Deep and Responsible Reasoning of Large Language Model on Knowledge Graph"
    org: Sun, Xu, Tang, Wang, Lin, Gong, Ni, Shum, Guo; ICLR 2024
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2307.07697
    published: 2023-07-15
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-015, KG-019]
    status: active
    quote: >-
      the LLM agent iteratively executes beam search on KG, discovers the most
      promising reasoning paths, and returns the most likely reasoning results.
    notes: >-
      Training-free, and the honest accounting of KG-015's cost: beam search over
      the graph with depth = width = 3, temperature 0.4 for exploration and 0
      for reasoning, 5-shot, 256 max generated tokens. GPT-4 reaches 82.6%
      WebQSP, 81.4% GrailQA (new SOTA at the time), 69.5% CWQ. The error
      analysis is the useful part for a regulated corpus: on GrailQA it cuts
      hallucination and refusal-to-answer errors by 50% and 60% versus
      IO/CoT prompting. Cost is stated rather than hidden: "considering the
      computational cost (which increases exponentially with depth), we set both
      depth and width to 3." Ablation: replacing the LLM pruner with BM25 or
      SentenceBERT costs 8.4% (CWQ) and 15.1% (WebQSP) -- search QUALITY is
      the lever, not the search algorithm.

  - id: S-222
    key: kg-agent-acl-2025
    title: "KG-Agent: An Efficient Autonomous Agent Framework for Complex Reasoning over Knowledge Graph"
    org: Jiang, Zhou, Zhao, Song, Zhu, Zhu, Wen; ACL 2025
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2402.11163
    published: 2024-02-17
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-015]
    status: active
    quote: >-
      we leverage program language to formulate the multi-hop reasoning process
      over the KG, and synthesize a code-based instruction dataset to fine-tune
      the base LLM.
    notes: >-
      The "emit code, not a query" variant of declarative traversal, and the
      cheapest to adopt for a controlled pipeline because it needs no query-
      language grammar. The agent writes the multi-hop traversal in a
      PROGRAMMING language, then a code-based SFT set is synthesised from it.
      10K synthesised samples tuning LLaMA-7B outperforms methods using larger
      LLMs or more data, in- and out-of-domain. The arXiv v1 self-labels "work
      in progress"; the ACL 2025 camera-ready is the citable version.

  - id: S-223
    key: graphwalk-tool-navigation
    title: "GraphWalk: Enabling Reasoning in Large Language Models through Tool-Based Graph Navigation"
    org: Ghandi, Mahyar, Klaiman (J.P. Morgan AI Research)
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2604.01610
    published: 2026-04-02
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-013, KG-016, KG-019]
    status: active
    quote: >-
      Unlike task-specific agent frameworks that encode domain knowledge into
      specialized tools, GraphWalk equips the LLM with a minimal set of
      orthogonal graph operations sufficient to traverse any graph structure.
    notes: >-
      The cleanest test of the schema-context premise, and the source of the
      most important negative result in the query thread. Its no-tool baseline is
      fed the COMPLETE 100-node graph in context -- exhaustive schema, zero
      retrieval error -- and models still fail, "suggesting that the core
      challenge lies in the reasoning step itself, not retrieval quality".
      The scalability experiment is sharper: o4-mini collapses from 59 correct
      answers at 100 nodes to 5 at 500 nodes DESPITE the graph still fitting in
      the context window. So exhaustive schema context is not a route to
      accuracy past a small graph. Also documents that Freebase/Wikidata KGQA
      leaderboards are contaminated by parametric memory -- LLMs score above 30%
      by prompting alone -- which inflates reported graph contribution across
      that literature (see KG-022).

  - id: S-224
    key: g-retriever-neurips-2024
    title: "G-Retriever: Retrieval-Augmented Generation for Textual Graph Understanding and Question Answering"
    org: Xia, Jiang, Xu, Wang, Chen, Liu, Kim, Sun, Yu; NeurIPS 2024
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2402.07630
    published: 2024-02-27
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-013, KG-019]
    status: active
    quote: >-
      Converting a graph with thousands of nodes and edges into a text sequence
      results in an excessive number of tokens, surpassing the input capacity of
      many LLMs. An alternative of truncating the graph text sequence to fit the
      LLM's input token limit leads to loss of information
    notes: >-
      Subgraph selection cast as a BUDGETED optimisation problem -- the
      principled answer to "which part of the graph do I show the model", rather
      than top-k sampling. Prize-Collecting Steiner Tree: every omitted node or
      edge costs, and the model's own answer scores the prize terms. It also
      names the failure of the naive alternative in the quote above, and the
      failure mode of GNN-style graph-token baselines: they hallucinate nodes
      and edges NOT PRESENT in the graph, which subgraph-RAG structurally
      prevents.

  - id: S-225
    key: kg-rag-sanmartin-negative
    title: "KG-RAG: Bridging the Gap Between Knowledge and Creativity"
    org: Sanmartin
    kind: preprint
    evidence: CONTESTED
    url: https://arxiv.org/abs/2405.12035
    published: 2024-05-20
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-020, KG-036, KG-037]
    status: active
    quote: >-
      KG-RAG demonstrated an accuracy of 32%, compared to 46% for
      Embedding-RAG. This reflects the capability of KG-RAG to retrieve relevant
      information, but it highlights a challenge in pinpointing the exact
      answers required for complex multi-hop questions.
    notes: >-
      The most important negative result in the query thread, and it is the
      paper's own. An LLM-built graph from raw web snippets, on
      ComplexWebQuestions, 100 dev questions: KG-RAG EM 19 / F1 25 / accuracy
      32 versus plain Embedding-RAG EM 28 / F1 37 / accuracy 46. The graph
      pipeline is WORSE on answer quality. The one win is faithfulness:
      hallucination 15% versus 30%, roughly halved. Far behind leaderboard
      baselines (human 63 EM, best machine 33.2 EM). The paper names its own
      failure mode: starting nodes are missed whenever the evidence span
      containing the answer was filtered out, so the graph is INCOMPLETE AT
      THE ENTRY POINT. SETUP CAVEATS, stated because the negative result should
      not be over-read: n=100, 11 questions discarded, single author, arXiv
      preprint, not peer-reviewed.

  - id: S-226
    key: graphrag-query-engine-docs
    title: "Query Engine -- GraphRAG documentation"
    org: Microsoft
    kind: framework-doc
    evidence: PRIMARY
    url: https://github.com/microsoft/graphrag/blob/main/docs/query/overview.md
    published: 2026
    retrieved: 2026-10-04
    recheck_after: 2027-04-04
    supports: [KG-016, KG-017]
    status: active
    quote: >-
      Global search generates answers by searching over all AI-generated
      community reports in a map-reduce fashion. This is a resource-intensive
      method, but often gives good responses for questions that require an
      understanding of the dataset as a whole
    notes: >-
      The canonical five-mode taxonomy (Local, Global, DRIFT, Basic, Question
      Generation) and the honest framing of Basic Search as a CONTROL rather
      than a product: "GraphRAG includes a rudimentary implementation of basic
      vector RAG to make it easy to compare different search results based on
      the type of question you are asking." The intended routing is by question
      type -- Local for entity-specific questions, Global for whole-dataset
      sensemaking. That routing-by-question-type is the shape KG-016 recommends.

  - id: S-227
    key: graphrag-drift-search-docs
    title: "DRIFT Search -- GraphRAG documentation"
    org: Microsoft
    kind: framework-doc
    evidence: PRIMARY
    url: https://github.com/microsoft/graphrag/blob/main/docs/query/drift_search.md
    published: 2026
    retrieved: 2026-10-04
    recheck_after: 2027-04-04
    supports: [KG-017]
    status: active
    quote: >-
      DRIFT search (Dynamic Reasoning and Inference with Flexible Traversal)
      builds upon Microsoft's GraphRAG technique, combining characteristics of
      both global and local search to generate detailed responses in a method
      that balances computational costs with quality outcomes
    notes: >-
      The most prompt-centric search mechanism in the thread, and the one that
      most directly answers "how is the model told to search". Three phases:
      PRIMER compares the query against the top-K community reports and produces
      a broad answer PLUS generated follow-up questions; FOLLOW-UP feeds those
      into local search recursively; OUTPUT is a ranked hierarchy of questions
      and answers. The design point worth stealing for a controlled pipeline:
      each node carries a CONFIDENCE GLYPH deciding whether to continue
      expanding, so the model is its own stopping rule, with configurable
      model, context_builder, config, tokenizer for budget tracking, and
      query_state.

  - id: S-228
    key: lightrag-emnlp-2025
    title: "LightRAG: Simple and Fast Retrieval-Augmented Generation"
    org: Li, Ning et al. (HKU); EMNLP 2025
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2410.05779
    published: 2024-10-07
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-016, KG-030]
    status: active
    quote: >-
      In the retrieval phase, GraphRAG generates 1,399 communities, with 610
      level-2 communities actively utilized for retrieval in this experiment.
      Each community report averages 1,000 tokens, resulting in a total token
      consumption of 610,000 tokens
    notes: >-
      The only head-to-head COST comparison against Microsoft GraphRAG found
      anywhere. On the Legal dataset GraphRAG retrieval consumes 610,000
      tokens across hundreds of API calls, one per community report, while
      LightRAG's dual-level retrieval (low-level entity/relation keys plus
      high-level theme keys) uses under 100 tokens in a SINGLE call. The
      incremental-update number matters more for a pipeline that must absorb
      new regulations: adding a same-size corpus forces GraphRAG to rebuild the
      community structure at roughly 1,399 x 2 x 5,000 = 14M tokens, whereas
      LightRAG merges into the existing graph.

  - id: S-229
    key: hipporag-neurips-2024
    title: "HippoRAG: Neurobiologically Inspired Long-Term Memory for Large Language Models"
    org: Jimenez Gutierrez, Shu, Qi et al.; NeurIPS 2024
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2405.14831
    published: 2024-05-23
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-015, KG-018]
    status: active
    quote: >-
      Single-step retrieval with HippoRAG achieves comparable or better
      performance than iterative retrieval like IRCoT while being 10-30 times
      cheaper and 6-13 times faster
    notes: >-
      The strongest argument in the survey that many "agentic graph search"
      loops are doing work a graph algorithm should do. LLM + graph +
      Personalized PageRank, up to 20% improvement over SOTA multi-hop QA at
      10-30x lower cost and 6-13x lower latency than iterative retrieval. For
      AEGIS the relevant primitive is not the memory framing but the operator:
      a SYMBOLIC traversal step (PPR over the graph) can substitute for several
      LLM turns at no accuracy cost, which is what a seeded local pipeline
      wants.

  - id: S-230
    key: do-we-still-need-graphrag
    title: "Do We Still Need GraphRAG? Benchmarking RAG and GraphRAG for Agentic Search Systems"
    org: Fan, Xue, Liu, Tan
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2604.09666
    published: 2026-04-01
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-020, KG-031]
    status: active
    quote: >-
      Our results show that agentic search substantially improves dense RAG and
      narrows the performance gap to GraphRAG, particularly in RL-based
      settings. Nevertheless, GraphRAG remains advantageous for complex
      multi-hop reasoning, exhibiting more stable agentic search behavior when
      its offline cost is amortized.
    notes: >-
      The most important recent challenge to GraphRAG, and the conditional
      verdict KG-031 rests on. The single most useful clause is the last one:
      the decision variable is the OFFLINE/ONLINE BREAK-EVEN, not the QA score.
      Supporting numbers: on general QA dense RAG is already competitive and
      GraphRAG gains only +0.47 on average, against +27.23 on multi-hop; and
      the GraphRAG-minus-dense gap SHRINKS with a stronger backbone (14.70 to
      9.75 at 3B to 7B, and 7.80 to 7.19 training-free at 7B to 32B) -- a
      better model buys back some of what the graph was supposed to buy.
      Construction cost per 1M tokens on NQ: GraphRAG 1.72h and $13.19 at
      22,160 context tokens per query, versus RAPTOR 1.70h and $6.38 at 814
      tokens, versus LinearRAG 0.68h and $0 at 4,600 tokens.

  - id: S-231
    key: chatkbqa-generate-then-retrieve
    title: "ChatKBQA: A Generate-then-Retrieve Framework for Knowledge Base Question Answering with Fine-tuned Large Language Models"
    org: Dai, Wang, Ma, Mao, Wang, Xu, Xiao; Findings of ACL 2024
    kind: preprint
    evidence: PEER
    url: https://aclanthology.org/2024.findings-acl.122/
    published: 2024
    retrieved: 2026-10-04
    recheck_after: never
    supports: [KG-011, KG-014]
    status: active
    quote: >-
      ChatKBQA, a novel and simple generate-then-retrieve KBQA framework, which
      proposes first generating the logical form with fine-tuned LLMs, then
      retrieving and replacing entities and relations with an unsupervised
      retrieval method
    notes: >-
      Inverts the usual order: DECLARE THEN RESOLVE. The model emits a logical
      form whose entities and relations may be wrong, and an unsupervised
      retriever then replaces them with ground-truth graph identifiers. This is
      the cheapest of the KG-014 family to implement in a controlled pipeline,
      because it needs no grammar and no query language -- only a resolver over
      canonical ids. Motivated by three named bottlenecks: inefficient
      knowledge retrieval, retrieval mistakes corrupting semantic parsing, and
      the complexity of prior systems.

  - id: S-232
    key: magic-self-correction-aaai-2025
    title: "MAGIC: Generating Self-Correction Guideline for In-Context Text-to-SQL"
    org: Askari, Poelitz, Tang; AAAI 2025
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2406.12692
    published: 2024-06-18
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-019]
    status: active
    quote: >-
      Our extensive experiments show that MAGIC's guideline outperforms expert
      human's created ones.
    notes: >-
      Self-correction in query generation normally depends on hand-written
      guidelines; MAGIC automates their creation with three agents (manager,
      correction, feedback) that iterate over the ACTUAL failures of a
      candidate method on a training set, producing a guideline tailored to
      that model's error modes. Two claims worth carrying: the auto-generated
      guideline beats human-expert guidelines, and it improves the
      INTERPRETABILITY of corrections, because you can see why a correction
      fired. Directly relevant to this repo, whose current repair loop reuses
      the parser's error message -- an auto-generated, model-specific
      self-correction guideline is a strictly better input to that loop. The
      abstract publishes no accuracy deltas.

  # --- Evaluation (KG-020 to KG-026) ---

  - id: S-233
    key: kg-rag-dataset-pitfalls
    title: "Diagnosing and Addressing Pitfalls in KG-RAG Datasets: Toward More Reliable Benchmarking"
    org: Zhang, Jiang, Chi, Chen, Elkoumy, Wang, Wu, Zhou, Pan, Wang, Ma
    kind: preprint
    evidence: PRIMARY
    url: https://arxiv.org/abs/2505.23495
    published: 2025-05-29
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-021, KG-022, KG-023]
    status: active
    quote: >-
      In WebQSP, only 52% of the sampled answers were judged correct, with
      quality issues including inaccurate answer and poor questions. Similarly,
      CWQ, which builds on WebQSP as its seed, achieved a correctness rate of
      just 49.33%
    notes: >-
      The single most important source for anyone planning a KGQA evaluation,
      and the reason KG-021 treats "build a benchmark" as a liability rather
      than an asset. Manual audit of 16 popular KGQA datasets, over 1,000
      question-answer pairs hand-evaluated. Per-dataset factual correctness:
      WebQSP 52.00%, CWQ 49.33%, CFQ 71.67%; AVERAGE ACROSS ALL 16 DATASETS =
      57%. Roughly half the errors you would attribute to your system are in
      the labels. Three specific traps: (a) exact match produces FALSE NEGATIVES
      on correct answers -- for "What is the Australian dollar called?" gold is
      AUD and the prediction "Australian dollar" is scored wrong; (b)
      unanswerable and subjective questions are embedded in the gold ("What to
      do today in Atlanta with kids?"); (c) Freebase was officially dumped in
      2016, so gold answers are checked against a DEAD GRAPH. Notes that about
      30 KG-RAG papers released 2022-2025 used WebQSP and/or CWQ.

  - id: S-234
    key: when-to-use-graphs-iclr-2026
    title: "When to use Graphs in RAG: A Comprehensive Analysis for Graph Retrieval-Augmented Generation"
    org: Xiang, Wu, Zhang, Chen et al.; ICLR 2026
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2506.05690
    published: 2025-06-06
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-020, KG-021, KG-026]
    status: active
    quote: >-
      Despite its conceptual promise, recent studies report that GraphRAG models
      frequently underperform traditional RAG approaches on many real-world
      tasks.
    notes: >-
      Reframes the question from "does GraphRAG work" to "under what conditions",
      which is the shape of KG-020. Introduces GraphRAG-Bench and evaluates
      construction, retrieval and generation SEPARATELY, which most papers do
      not. The replication of S-171's negative result on a different benchmark:
      on Fact Retrieval, RAG-with-rerank 60.92 beats every GraphRAG method
      (best GraphRAG HippoRAG2 at 60.14) on one corpus and effectively ties on
      the other (64.73 versus 66.28). GraphRAG wins on Complex Reasoning,
      Contextual Summarize and Creative Generation. It also cites S-171's
      headline figures: 13.4% lower accuracy than vanilla RAG on Natural
      Questions, 16.6% drop on time-sensitive queries. Proposes structural
      graph-quality metrics (NodeCount, EdgeCount, AverageDegree,
      AverageClusteringCoefficient) -- see KG-026 on why those are diagnostic
      rather than normative.

  - id: S-235
    key: graphrag-bench
    title: "GraphRAG-Bench: Challenging Domain-Specific Reasoning for Evaluating Graph Retrieval-Augmented Generation"
    org: Xiao, Dong, Zhou, Dong et al.
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2506.02404
    published: 2025-06-03
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-021, KG-026]
    status: active
    quote: >-
      GraphRAG-Bench provides comprehensive assessment across the entire
      GraphRAG pipeline, including graph construction, knowledge retrieval, and
      answer generation.
    notes: >-
      16 disciplines, 20 core textbooks, college-level multi-hop questions
      across five response formats. The methodologically interesting part is
      that it scores the LOGICAL COHERENCE OF THE REASONING PROCESS, not just
      final-answer correctness, evaluated across construction, retrieval and
      generation -- the per-stage decomposition KG-020 recommends and that
      almost no public benchmark offers. Applied to nine GraphRAG methods.

  - id: S-236
    key: wildgraphbench-findings-acl-2026
    title: "WildGraphBench: Benchmarking GraphRAG with Wild-Source Corpora"
    org: Wang, Xu, Zhang, Wang et al.; Findings of ACL 2026
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2602.02053
    published: 2026-02-02
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-021, KG-025]
    status: active
    quote: >-
      current GraphRAG pipelines help on multi-fact aggregation when evidence
      comes from a moderate number of sources, but this aggregation paradigm may
      overemphasize high-level statements at the expense of fine-grained
      details, leading to weaker performance on summarization tasks.
    notes: >-
      1,100 questions over 12 Wikipedia topics, built from EXTERNAL REFERENCE
      DOCUMENTS rather than short curated passages, with citation-linked
      statements as ground truth. It attacks the two weakest properties of the
      canonical GraphRAG evaluation in one move: unreleased corpora and
      LLM-generated questions. The negative result for graph methods on
      summarization is the load-bearing half, and it is the second independent
      reference-based replication of S-171's finding against S-170.

  - id: S-237
    key: t2s-metrics-library
    title: "T2S-Metrics: Unified Library for Evaluating SPARQL Queries Generated From Natural Language"
    org: T2S-Metrics authors
    kind: framework-doc
    evidence: PRACTITIONER
    url: https://arxiv.org/abs/2604.26971
    published: 2026-04-22
    retrieved: 2026-10-04
    recheck_after: 2027-04-22
    supports: [KG-021, KG-025]
    status: active
    quote: >-
      Existing benchmarks typically focus on a small subset of metrics, such as
      query exact match or answer-level F1, neglecting syntactic validity,
      semantic faithfulness, execution correctness, results ranking quality, and
      computational efficiency.
    notes: >-
      The best available catalogue of graph-query metrics, explicitly modelled
      on ir-metrics, and the practical instrument behind KG-025. Over 20 metrics
      across six dimensions: lexical (token-level P/R/F1, BLEU, ROUGE, METEOR,
      CodeBLEU, SP-BLEU, SP-F1), structural/URI exact match, ANSWER-SET based
      (F1-QALD, Jaccard), ranking (MRR, NDCG, P@k, Hit@k), and LLM-as-judge.
      States the motivation precisely: n-gram metrics "penalize valid SPARQL
      queries that" are semantically equivalent via different surface forms
      (FILTER versus VALUES), and query correctness "cannot be assessed
      independently of" the graph.

  - id: S-238
    key: missdiag-incomplete-knowledge
    title: "MissDiag: Diagnostic Evaluation of Incomplete-Knowledge Robustness in KGQA and KG-RAG"
    org: Wang, Dong, Liu, Ren
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2608.18489
    published: 2026-08-19
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-022, KG-025]
    status: active
    quote: >-
      source-context removal is often neutral and can be beneficial, and
      semantic answer matching
    notes: >-
      The most directly transferable evaluation protocol in the survey, and the
      template for KG-022 and KG-025. Holds question and gold answer fixed while
      applying STRUCTURALLY TYPED missingness interventions -- Random,
      Source-context, Relation-level, Answer-adjacent -- each at severity alpha
      in {0.1, 0.3, 0.5}, producing PAIRED per-system F1 deltas. At alpha=0.3,
      Qwen2.5-7B exact-F1 paired degradation: Random 11.1, Source-context 3.0,
      Relation-level 7.4, ANSWER-ADJACENT 21.3. Four system families, 1,050
      items. The result KG-025 leans on: switching from exact F1 to semantic F1
      "changes degradation magnitudes but not the main typed pattern" -- the
      diagnostic conclusion is ROBUST TO THE ANSWER-MATCHING RULE, which is a
      licence to use cheap deterministic matching precisely because the study
      ran both.

  - id: S-239
    key: ares-ppi-evaluation
    title: "ARES: An Automated Evaluation Framework for Retrieval-Augmented Generation Systems"
    org: Saad-Falcon, Khattab, Potts, Zaharia (Stanford / DSPy)
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2311.09476
    published: 2023-11-16
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-021, KG-025]
    status: active
    quote: >-
      Across eight different knowledge-intensive tasks in KILT, SuperGLUE, and
      AIS, ARES accurately evaluates RAG systems while using only a few hundred
      human annotations during evaluation.
    notes: >-
      The most useful structural idea for KG-025 is not the metric but the
      UNCERTAINTY HANDLING: rather than prompting a frontier LLM, ARES
      fine-tunes lightweight judges on synthetic data and wraps them in
      prediction-powered inference, giving statistically valid confidence
      bounds from a few hundred human-labelled examples. Small calibrated
      judges with stated bounds are more reproducible than one big judge call,
      and PPI makes residual uncertainty explicit rather than hidden. Three
      dimensions: context relevance, answer faithfulness, answer relevance.

  - id: S-240
    key: ragchecker-meta-eval
    title: "RAGChecker: A Fine-grained Framework for Diagnosing Retrieval-Augmented Generation"
    org: RAGChecker (Amazon Science)
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2408.08067
    published: 2024-08-15
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-021, KG-025]
    status: active
    quote: >-
      Meta evaluation verifies that RAGChecker has significantly better
      correlations with human judgments than other evaluation metrics.
    notes: >-
      Supplies the CEILING numbers KG-021 needs. Meta-evaluated on 280
      human-labelled instances; Pearson/Spearman correlation with human
      preference reaches 49.66/46.95 (Correctness), 60.67/58.11 (Completeness),
      61.93/60.90 (Overall) -- against a HUMAN-HUMAN upper bound of
      63.67/59.19, 71.91/68.36, 70.09/68.89. So the best automatic metric
      captures roughly 75-86% of human inter-annotator correlation, with a
      substantial ceiling gap remaining. IMPORTANT LIMIT for KG-025: RAGChecker
      is NOT graph-aware -- its retrieval module operates on chunks, not on
      triples or paths, so using it unchanged on a graph system measures it with
      the wrong instrument.

  - id: S-241
    key: llm-judge-temperature-reproducibility
    title: "Necessary but Not Sufficient: Temperature Control and Reproducibility in LLM-as-Judge Safety Evaluations"
    org: Tamba
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2606.26185
    published: 2026-06-24
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-021, KG-025]
    status: active
    quote: >-
      A widespread assumption is that setting the grader's sampling temperature
      to 0 makes grading deterministic. We test this assumption against a real
      safety-evaluation codebase (Japan AISI's open-source aisev) and show it
      fails on two levels.
    notes: >-
      The definitive treatment of judge determinism, audited against a real
      production harness. The grader is invoked with temperature AND seed unset,
      so the provider default of 1.0 applies; 4 of 7 items are
      non-reproducible over 20 runs, with per-item disagreement up to ~50%.
      Pinning temperature=0 fixes two of the four and leaves 2/7 flipping;
      top_p does nothing; FORCED GREEDY DECODING (top_k=1) STILL LEAVES 1/7
      flipping, which locates the non-determinism in the FORWARD PASS rather
      than the sampler and means no sampling-side knob reaches it. Note for
      this repo: Claude Opus 4.7/4.8 reject temperature outright (HTTP 400), so
      the conventional mitigation is being withdrawn by the vendors while the
      underlying variance remains.

  - id: S-242
    key: triple-robustness-traceability-rag
    title: "A Triple-Robustness Analysis of Retrieval-Augmented Generation for Multi-Hop Requirements Traceability"
    org: Akarsu, Ozdemour, Buyukcolak (Turkish Aerospace Industries); Karaman (TU Munich)
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2608.00705
    published: 2026-08-01
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-021, KG-022, KG-025]
    status: active
    quote: >-
      same-input same-day test-retest gives kappa=0.76 (12% of verdicts flip on
      resampling alone), while re-judging the same tuples after an embedder swap
      gives kappa=0.14 (41% flip).
    notes: >-
      The most rigorous measurement of judge instability in a RAG setting, and
      the closest published analogue to this repo's own L3 judge layer. Note
      the domain: multi-hop REQUIREMENTS TRACEABILITY over DO-178C typed edges
      -- a regulated-document corpus, which is why KG-021 treats it as
      transferable. Four results: (a) inter-judge kappa HALVES under embedder
      swap on identical tuples (0.30 to 0.17), and on MuSiQue the two judges
      agree at CHANCE (kappa 0.02, raw agreement 0.48), with GPT-4.1 judging 88%
      faithful where GPT-5.4 judges 47%; (b) re-judging FROZEN IDENTICAL inputs
      eleven weeks later gives kappa 0.138 (GPT-5.4) and kappa -0.05 (GPT-4.1)
      against its own earlier verdicts -- chance-level, a +41pp leniency shift,
      rejecting stationarity at binomial p<1e-44, so a published judge number is
      not comparable to itself over time; (c) stability on one axis does not
      transfer to the other; (d) THE MOST IMPORTANT FOR KG-025: scoring the
      retrieved set as the attribution set ranks GraphRAG LAST, while scoring
      the answer's own citations ranks it BEST OR TIED-BEST -- the measurement
      POINT, not the architecture, drove the ranking. Report both.

  - id: S-243
    key: q-care-colm-2026
    title: "Towards Query-Agnostic RAG Evaluation via Query Coverage and Claim Verifiability (Q-CARE)"
    org: Choi, Yun, Ban, Sun et al.; COLM 2026
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2608.11238
    published: 2026-07-31
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-021, KG-025]
    status: active
    quote: >-
      traditional metrics exhibit weak correlation with composite human scores,
      whereas the coverage-aware metrics achieve substantially higher agreement
      across both query types.
    notes: >-
      Reference-free and decomposing queries into sub-queries and answers into
      atomic claims, which is structurally the right shape for graph answers
      where the claim-to-path relationship is what matters. Pearson with human
      judgment on an eight-dataset benchmark: Q-CARE 0.55/0.43 on close-ended
      precision-style metrics, 0.52/0.47/0.40 on
      Completeness/Conciseness/Verifiableness, against RAGAS 0.24-0.44 and
      RAGChecker 0.17-0.56 on comparable dimensions, all significant at
      p<0.01. Two findings that constrain KG-025: classical Precision@k and
      nDCG@k correlate only 0.286 and 0.141 with a human composite score on
      close-ended queries, so classical IR metrics are a weak quality proxy;
      and BACKBONE MATTERS ENORMOUSLY -- Llama-3.1-8B gives
      Completeness/Conciseness/Verifiableness of 0.14/0.16/0.07 against
      GPT-5-mini's 0.51/0.50/0.45, a 3-7x swing from backbone choice alone. For a
      LOCAL-model pipeline that is a direct warning that a judge may not be able
      to score what the pipeline produces.

  - id: S-244
    key: abstention-vs-hallucination-reasons
    title: "Abstention vs. Hallucination: Benchmarking LLM Source Attribution for Scientific Citations"
    org: REASONS authors
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2405.02228
    published: 2024-05-03
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-021, KG-025]
    status: active
    quote: >-
      We introduce a dual metric -- Abstention Rate (AR) and Hallucination Rate
      (HR) -- to characterize the reliability-responsiveness trade-off explicitly
      rather than collapsing it.
    notes: >-
      The source of the paired abstention/hallucination metric that KG-025
      recommends, and of the sharpest warning in the survey for a pipeline whose
      subject matter is regulatory compliance. 12,723 sentence-level citation
      instances across 12 arXiv subject categories. Advanced RAG lowers
      hallucination relative to naive RAG (65.4% versus 87.6%) but drives
      abstention from 5.0% to ZERO -- retrieval makes the system ALWAYS ANSWER,
      whether or not evidence supports it. Human evaluation of 1,000 outputs at
      kappa 0.78 found a 12.7:1 ratio of factual hallucinations to acceptable
      paraphrases, so surface paraphrase is minor relative to fabrication.
      CAVEAT: read via abstract only in this pass; no quote beyond the abstract
      is claimed.

  - id: S-245
