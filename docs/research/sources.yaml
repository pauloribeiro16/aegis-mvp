    retrieved: 2026-10-03
    recheck_after: 2027-05-29
    supports: [AO-008]
    status: active
    notes: >-
      1,319 tasks from post-2024 GitHub issues across 93 repos, one Docker task.
      Addresses staleness, narrow repo coverage and contamination — the three ways
      a static agentic benchmark rots.

  - id: S-156
    key: swe-bench-test-overfitting
    title: "Investigating Test Overfitting in SWE-bench"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2511.16858
    published: 2025-11-20
    retrieved: 2026-10-03
    recheck_after: 2027-11-20
    supports: [AO-008, PP-016]
    status: active
    notes: >-
      Code that technically passes observed tests but actually misses important
      cases. The direct analogue for AEGIS: a goal row that passes every L0 and
      L1 check while being substantively wrong. This is the class of defect a
      conformance-only validator cannot catch, and it is why conformance is not
      correctness.

  - id: S-157
    key: mcp-agentbench
    title: "MCP-AgentBench"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2509.09734
    published: 2025-09-10
    retrieved: 2026-10-03
    recheck_after: 2027-09-10
    supports: [AO-008, AO-005]
    status: active
    notes: >-
      33 operational MCP servers, 188 tools, 600 queries. Motivated by the
      observation that "existing benchmarks often fail to capture real-world agent
      performance within this new paradigm, leading to a distorted perception of
      their true operational value". The consequence for 2026: the harness and
      transports are now part of what is being measured.

  - id: S-158
    key: memgpt
    title: "MemGPT: Towards LLMs as Operating Systems"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2310.08560
    published: 2023-10-12
    retrieved: 2026-10-03
    recheck_after: 2027-10-12
    supports: [AO-003]
    status: active
    notes: >-
      Virtual context management drawing on hierarchical memory systems in
      operating systems, using interrupts to manage control flow. The origin point
      for treating context as a managed resource rather than a container.

  - id: S-159
    key: ace-agentic-context-engineering
    title: "ACE: Agentic Context Engineering"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2510.04618
    published: 2025-10-06
    retrieved: 2026-10-03
    recheck_after: 2027-10-06
    supports: [AO-003]
    status: active
    notes: >-
      Contexts as "evolving playbooks that accumulate, refine, and organize
      strategies through a modular process of generation, reflection, and
      curation". Names two failure modes of naive memory: brevity bias, which
      drops domain insights for concise summaries, and context collapse, where
      iterative rewriting erodes details over time. Both are live risks for the
      repo's agent history-elision pass (E-11).

  - id: S-160
    key: memory-storage-to-experience-survey
    title: "From Storage to Experience"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2605.06716
    published: 2026-05-07
    retrieved: 2026-10-03
    recheck_after: 2027-05-07
    supports: [AO-003, AO-013]
    status: active
    notes: >-
      Storage -> Reflection -> Experience progression, and an honest field
      assessment: memory is "fragmented, oscillating between operating system
      engineering and cognitive science". Write policies, forgetting and rollback
      are unsolved, which is why AO-003 treats file-state gates as a valid
      alternative to agent memory rather than a workaround.

  - id: S-161
    key: long-term-memory-security-survey
    title: "A Survey on Long-Term Memory Security in LLM Agents"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2604.16548
    published: 2026-04-17
    retrieved: 2026-10-03
    recheck_after: 2027-04-17
    supports: [AO-003, AO-011]
    status: active
    quote: >-
      persistence, statefulness, and propagation
    notes: >-
      Writable cross-session memory is "a qualitatively different threat landscape
      from conventional input-centric security concerns". Six lifecycle phases
      (Write, Store, Retrieve, Execute, Share and Propagate, Forget and Rollback).
      The proposed Verifiable Memory Governance primitives are auditable,
      recoverable control over memory state — the same property the repo gets from
      file-state gates for free.

  - id: S-162
    key: magentic-one
    title: "Magentic-One: A Generalist Multi-Agent System for Solving Complex Tasks"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2411.04468
    published: 2024-11-07
    retrieved: 2026-10-03
    recheck_after: 2027-11-07
    supports: [AO-002]
    status: active
    notes: >-
      The canonical dynamic topology: an Orchestrator that plans, tracks progress
      and re-plans to recover from errors, over specialised executors. The
      re-planning loop is the part that transfers to the agent arm's
      progress watchdog.

  - id: S-163
    key: mixture-of-agents
    title: "Mixture-of-Agents Enhances Large Language Model Capabilities"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2406.04692
    published: 2024-06-07
    retrieved: 2026-10-03
    recheck_after: 2027-06-07
    supports: [AO-002, AO-006]
    status: active
    notes: >-
      Layered architecture where each layer takes all outputs from the previous
      layer. Reported 65.1% on AlpacaEval 2.0 with open models against 57.5% for
      GPT-4o. Kept deliberately as the strongest pro-aggregation result in the
      registry, so the AO-006 conclusion is stated as contested rather than
      settled: S-132 and S-140 explain why the same mechanism may not transfer
      to a task with shared context.

  - id: S-164
    key: design-patterns-securing-llm-agents
    title: "Design Patterns for Securing LLM Agents against Prompt Injections"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2506.08837
    published: 2025-06-10
    retrieved: 2026-10-03
    recheck_after: 2027-06-10
    supports: [AO-011]
    status: active
    notes: >-
      The paper Simon Willison cites for mitigations: principled design patterns
      with "provable resistance" to prompt injection, with trade-offs in utility
      and security worked through case studies. What provable resistance can and
      cannot mean is the honest frame for the AEGIS injection gap — the patterns
      bound the problem, they do not solve it.

