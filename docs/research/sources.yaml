  - id: S-070
    key: otel-genai-spans
    title: "OpenTelemetry GenAI semantic conventions — GenAI spans"
    org: OpenTelemetry
    kind: standard
    evidence: PRIMARY
    url: https://github.com/open-telemetry/semantic-conventions-genai/blob/main/docs/gen-ai/gen-ai-spans.md
    published: 2026
    retrieved: 2026-10-03
    recheck_after: 2027-04-03
    supports: [PP-017, AO-010]
    status: active
    quote: >-
      If a transient issue happened and the request was retried automatically, the
      corresponding span SHOULD cover the duration of the logical operation with
      all retries.
    notes: >-
      Status: Development. The GenAI conventions MOVED out of the core
      semantic-conventions repository into semantic-conventions-genai; the old
      URLs are redirects. The retry rule is the canonical encoding of a
      step-level retry, which pairs directly with checkpoint/resume (PP-018), and
      the note that same-process models should be INTERNAL is the convention's
      own acknowledgement of local inference.

  - id: S-071
    key: otel-genai-agent-spans
    title: "OpenTelemetry GenAI semantic conventions — Agent and framework spans"
    org: OpenTelemetry
    kind: standard
    evidence: PRIMARY
    url: https://github.com/open-telemetry/semantic-conventions-genai/blob/main/docs/gen-ai/gen-ai-agent-spans.md
    published: 2026
    retrieved: 2026-10-03
    recheck_after: 2027-04-03
    supports: [AO-010, PP-017]
    status: active
    notes: >-
      Status: Development. Defines create_agent, invoke_agent (client and
      internal), invoke_workflow, plan, and execute_tool spans, plus agent-skills
      sub-spans. invoke_workflow existing as a first-class traced operation is the
      part relevant to AEGIS: it is the standard's name for what the repo's
      trace.jsonl already records per stage.

  - id: S-072
    key: otel-genai-mcp
    title: "OpenTelemetry GenAI semantic conventions — MCP"
    org: OpenTelemetry
    kind: standard
    evidence: PRIMARY
    url: https://github.com/open-telemetry/semantic-conventions-genai/blob/main/docs/gen-ai/mcp.md
    published: 2026
    retrieved: 2026-10-03
    recheck_after: 2027-04-03
    supports: [AO-010, AO-005]
    status: active
    notes: >-
      Status: Development. W3C Trace Context is injected into params._meta, with
      traceparent / tracestate / baggage written unprefixed per MCP SEP-414. The
      non-obvious rule: MCP span and transport span are independent contexts, and
      if outer GenAI instrumentation already traces the tool execution, MCP
      instrumentation SHOULD NOT create a duplicate span. Relevant to any future
      adoption, not to the current stdlib-only runtime.

  - id: S-073
    key: langsmith-evaluation
    title: "LangSmith — Evaluation"
    org: LangChain
    kind: framework-doc
    evidence: PRIMARY
    url: https://docs.langchain.com/langsmith/evaluation
    published: 2026
    retrieved: 2026-10-03
    recheck_after: 2027-04-03
    supports: [PP-016, PP-017]
    status: active
    quote: >-
      Add real traces to a dataset so a failure you saw once becomes a test you
      run every time.
    notes: >-
      The mechanism that converts a recurrence into a regression test. Evaluator
      types: human review, code rules, LLM-as-judge, pairwise comparison. Offline
      (curated datasets) vs online (live traffic) evaluation. Cited for the
      principle, not as an AEGIS dependency.

  - id: S-074
    key: ragas-metrics
    title: "Ragas — Available metrics"
    org: Ragas
    kind: framework-doc
    evidence: PRIMARY
    url: https://docs.ragas.io/en/stable/concepts/metrics/available_metrics/
    published: 2026
    retrieved: 2026-10-03
    recheck_after: 2027-04-03
    supports: [PP-014, PP-016]
    status: active
    notes: >-
      The metric inventory is the useful part: RAG metrics (context precision,
      context recall, context entities recall, noise sensitivity, faithfulness),
      agent/tool metrics (topic adherence, tool call accuracy, tool call F1,
      agent goal accuracy) and — importantly — non-LLM string metrics alongside
      the judge metrics. Pair with S-077: one 2026 chunking study found RAGAS
      faithfulness itself unreliable on structured academic text. Instruments need
      calibration before they are trusted.

  - id: S-075
    key: promptfoo
    title: "promptfoo"
    org: promptfoo (part of OpenAI)
    kind: infrastructure-doc
