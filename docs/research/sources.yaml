  - id: S-152
    key: tau-bench
    title: "tau-bench: A Benchmark for Tool-Agent-User Interaction in Real-World Domains"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2406.12045
    published: 2024-06-17
    retrieved: 2026-10-03
    recheck_after: 2027-06-17
    supports: [AO-008, AO-009]
    status: active
    notes: >-
      Grades against database state rather than transcript text, and introduces
      the pass^k reliability metric because a single pass is not a measurement.
      gpt-4o scored under 50% pass, under 25% pass^8 in retail. Two design
      decisions here are directly transferable: grade against environment state,
      and treat reliability across trials as a separate metric from capability.

  - id: S-153
    key: tau2-bench
    title: "tau^2-bench"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2506.07982
    published: 2025-06-09
    retrieved: 2026-10-03
    recheck_after: 2027-06-09
    supports: [AO-008, AO-007]
    status: active
    notes: >-
      Dual-control environment where the user also has tools and mutates shared
      world state, with a user simulator tightly coupled to the environment. The
      trajectory corpus is what S-134 analyses for false success.

  - id: S-154
    key: swe-bench-plus
    title: "SWE-Bench+: Improved Coding Benchmark for LLMs"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2410.06992
    published: 2024-10-09
    retrieved: 2026-10-03
    recheck_after: 2027-10-09
    supports: [AO-008]
    status: active
    notes: >-
      Found that 32.67% of successful patches involve solution leakage, plus weak
      tests. The template for benchmark scepticism: an agentic leaderboard can be
      measuring contamination and test weakness, not capability.

  - id: S-155
    key: swe-bench-live
    title: "SWE-bench Goes Live!"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2505.23419
