# aegis-mvp configuration
#
# Working corpus: the in-repo MODULAR baseline under baseline/ (independent
# per-regulation modules), derived deterministically from the frozen AEGIS
# methodology baseline inside Methodology_compact by the chain
# reorg_by_domain_md.py -> annotate_baseline_domains.py -> modularize_domains.py
# (audit trail: baseline/domains/_migration_report.md).
# Methodology_compact remains the read-only provenance source — never write to
# it (SPEC.md §10).

corpus:
  # Working corpus root (38 sub-domains D-XX.Y in modular layout + referentials)
  root: "baseline"
  # Sub-domain corpus: domains/D-0X_Name/D-XX.Y/{_index.md, objective.md, regs/, cross/, articles/}
  domains: "baseline/domains"
  # Control referentials:
  #   Enforced (R2b-checked by scripts/verify_no_loss.py): NIST_CSF_2.0, NIST_PF, NIST_AI_RMF.
  #   Advisory (per-control JSONs available for citation, not enforced by verify_no_loss.py):
  #     NIST_SP_800_53R5, NIST_SSDF, NIST_AI_SSDF, OWASP_ASVS, OWASP_SAMM,
  #     ISO_27001_2022, ISO_27701_2019, ISO_42001_2023, CIS_CONTROLS_V8,
  #     BSI_GRUNDSCHUTZ, ENISA.
  controls: "baseline/CONTROLS"
  # Domain index (10 domains, 38 sub-domains, modular layout)
  domains_index: "baseline/domains/index.md"
  # SR <-> control mapping store: complete per-regulation mappings (NIST CSF 2.0,
  # NIST PF 1.1 for GDPR, NIST AI RMF for AI_Act) extracted verbatim from the
  # frozen per-regulation dashboards by scripts/extract_dashboard_mappings.py.
  # Read-only provenance of the dashboards: Methodology_compact 00_VISUALISATIONS.
  sr_control_mappings: "baseline/MAPPINGS/sr_control_mappings"
  # Full baseline traceability chain (regulation -> article -> ambiguity clause ->
  # HSO -> SO-<REG> -> Sub-SO -> requirement -> CSF/PF/AI-RMF controls), generated by
  # scripts/build_traceability.py from the modules + the mapping store.
  traceability: "baseline/MAPPINGS/traceability"

ambiguity_registry:
  # Canonical cross-case ambiguity baseline (49 clause cards); per-clause citations
  # must point here, not be re-derived. Provenance: Methodology_compact AMBIGUITY_REGISTRY.
  path: "../Methodology_compact/00_METHODOLOGY/AMBIGUITY_REGISTRY/registry.md"

pipeline:
  # Output language for generated documents
  output_language: "en"
  # Objective ID scheme: AG-D-XX.Y-NNN (sequential per sub-domain within a run)
  objective_id_prefix: "AG"
