# Source registry for docs/research/ (AEGIS-RES).
#
# This file is the anchoring point for the research documents. Every factual
# claim in 01_PIPELINE_PATTERNS.md, 02_AGENT_ORCHESTRATION_PATTERNS.md,
# 03_PATTERN_MAPPING.md and 04_EXPERIMENT_BACKLOG.md carries an [S-nnn] token
# that must resolve to an entry here. Enforced by scripts/check_research_refs.py
# (checks R1-R7). Read that script before editing this file.
#
# FIELD CONTRACT
#   id             S-nnn. Unique, stable, never reused.
#   key            short slug, unique, for cross-reference by humans.
#   title          as published.
#   org            publishing organisation.
#   kind           vendor-primary | standard | preprint | framework-doc |
#                  practitioner | infrastructure-doc | prior-review
#   evidence       PRIMARY | PEER | PRACTITIONER | CONTESTED | UNVERIFIED
#                  PRIMARY      vendor/official spec/framework docs, read directly
#                  PEER         preprint or paper; peer status not established
#                  PRACTITIONER named expert writing from experience; opinion
#                  CONTESTED    credible sources disagree; the entry records both
#                  UNVERIFIED   could NOT be opened this pass; carry no quote
#   url            https URL. Required unless status: superseded-and-local.
#   published      YYYY | YYYY-MM | YYYY-MM-DD as published.
#   retrieved      YYYY-MM-DD of the pass that actually read this source.
#                  Sources carried over from the 2026-10-01 literature review
#                  keep that date; they were NOT re-read in the 2026-10 pass.
#   recheck_after  YYYY-MM-DD, or the literal `never` for a frozen artefact.
#                  The drift alarm: check_research_refs.py R4 fails when this
#                  date has passed. Living vendor docs get 6 months, preprints
#                  and blogs 12 months.
#   supports       pattern IDs this source underwrites (PP-nnn / AO-nnn).
#   status         active | superseded | unverified
#   quote          verbatim excerpt supporting the claim(s). OMITTED for
#                  evidence: UNVERIFIED (check R7 forbids quoting those).
#   notes          reading caveats, contradictions, superseded-by chains.
#
# MAINTENANCE RULE: when a source is re-read, bump `retrieved` and push
# `recheck_after` forward in the same edit. Never bump `retrieved` without
# having actually opened the page.

sources:

  # ------------------------------------------------------------------
  # Vendor primary — Anthropic
  # ------------------------------------------------------------------

  - id: S-001
    key: anthropic-building-effective-agents
    title: "Building effective agents"
    org: Anthropic
    kind: vendor-primary
    evidence: PRIMARY
    url: https://www.anthropic.com/engineering/building-effective-agents
    published: 2024-12-19
    retrieved: 2026-10-03
    recheck_after: 2027-04-03
    supports: [PP-001, PP-002, PP-003, PP-004, PP-006, PP-007, PP-009, AO-001, AO-002, AO-004]
    status: active
    quote: >-
      Workflows are systems where LLMs and tools are orchestrated through
      predefined code paths. Agents, on the other hand, are systems where LLMs
      dynamically direct their own processes and tool usage, maintaining control
      over how they accomplish tasks.
    notes: >-
      The canonical pattern vocabulary (prompt chaining, routing, parallelization
      = sectioning + voting, orchestrator-workers, evaluator-optimizer). The page
      itself carries a maintainer caveat: "Much of the tooling landscape
      described in this post has changed since December 2024." The taxonomy holds;
      the SDK list does not. Also carries the three named principles (simplicity,
      transparency, ACI care) and the ladder: single call -> workflow -> agent.

  - id: S-002
    key: anthropic-multi-agent-research-system
    title: "How we built our multi-agent research system"
    org: Anthropic
    kind: vendor-primary
    evidence: PRIMARY
    url: https://www.anthropic.com/engineering/multi-agent-research-system
    published: 2025-06-13
    retrieved: 2026-10-03
    recheck_after: 2027-04-03
    supports: [PP-004, PP-005, PP-011, PP-016, PP-018, PP-019, AO-002, AO-003, AO-006, AO-009]
    status: active
    quote: >-
      We combine the adaptability of AI agents built on Claude with deterministic
      safeguards like retry logic and regular checkpoints.
    notes: >-
      Vendor-internal evals, not peer-reviewed, and Anthropic sells the product —
      but it is unusually candid about its own failure modes. Load-bearing numbers:
      +90.2% multi-agent over single-agent on their internal research eval; on
      BrowseComp three factors explain 95% of variance and token usage alone
      explains 80%; agents ~4x chat tokens, multi-agent ~15x. Two findings used
      against the multi-agent enthusiasm elsewhere in this registry: (a) a single
      well-shaped judge call beat multi-judge ensembles on consistency and human
      alignment; (b) explicit scope limit — multi-agent does not fit tasks needing
      shared context or tight dependencies. Contains the non-determinism
      admission quoted in PP-011.

  - id: S-003
    key: anthropic-contextual-retrieval
    title: "Introducing Contextual Retrieval"
    org: Anthropic
    kind: vendor-primary
    evidence: PRIMARY
    url: https://www.anthropic.com/news/contextual-retrieval
    published: 2024-09-19
    retrieved: 2026-10-03
    recheck_after: 2027-04-03
    supports: [PP-009, PP-013, PP-014]
    status: active
    quote: >-
      If your knowledge base is smaller than 200,000 tokens (about 500 pages of
      material), you can just include the entire knowledge base in the prompt that
      you give the model, with no need for RAG or similar methods.
    notes: >-
      Vendor-authored and the technique uses Anthropic models, so partly
      self-serving. The durable contribution is the problem statement (chunking
      destroys document-level context) and the hybrid-search argument: embeddings
      "can miss crucial exact matches", BM25 catches "queries that include unique
      identifiers or technical terms" — directly relevant to a corpus queried by
      exact article number. Also reports 49% / 67% retrieval-failure reduction and
      the >2x latency / up to 90% cost effect of prompt caching.

  - id: S-004
    key: anthropic-context-engineering
    title: "Effective context engineering for AI agents"
    org: Anthropic
    kind: vendor-primary
    evidence: PRIMARY
    url: https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents
    published: 2025-09-29
    retrieved: 2026-10-03
    recheck_after: 2027-04-03
    supports: [PP-013, PP-021, AO-003, AO-005]
    status: active
    quote: >-
      Given that LLMs are constrained by a finite attention budget, good context
      engineering means finding the smallest possible set of high-signal tokens
      that maximize the likelihood of some desired outcome.
    notes: >-
      The clearest 2025-2026 collapse of the workflow/agent split: "Since we wrote
      that post, we've gravitated towards a simple definition for agents: LLMs
      autonomously using tools in a loop." The distinguishing axis becomes
      pre-inference retrieval vs just-in-time retrieval, not workflow vs agent.
      Also the source of the altitude framing (brittle hardcoded logic in prompts
      vs vague guidance that falsely assumes shared context) and the anti-pattern
      of "stuffing a laundry list of edge cases into a prompt" in favour of
      diverse canonical examples.

  - id: S-005
    key: anthropic-code-execution-mcp
    title: "Code execution with MCP: Building more efficient agents"
    org: Anthropic
    kind: vendor-primary
    evidence: PRIMARY
    url: https://www.anthropic.com/engineering/code-execution-with-mcp
    published: 2025-11-04
    retrieved: 2026-10-03
    recheck_after: 2027-04-03
    supports: [PP-009, PP-020, AO-004, AO-005]
    status: active
    quote: >-
      Then, when the data is shared in another MCP tool call, it is untokenized via
      a lookup in the MCP client. The real email addresses, phone numbers, and
      names flow from Google Sheets to Salesforce, but never through the model.
    notes: >-
      The single most transferable pattern found in this pass (PP-020). Reports
      150,000 -> 2,000 tokens, a 98.7% reduction, by exposing MCP servers as a
      filesystem of code modules instead of direct tool calls. The correctness
      argument matters more than the cost argument for AEGIS: "With large
      documents or complex data structures, models may be more likely to make
      mistakes when copying data between tool calls." Corroborated independently
      by Cloudflare's Code Mode, which was NOT read directly (see S-046).

  - id: S-006
    key: anthropic-writing-effective-tools
    title: "Writing effective tools for agents - with agents"
    org: Anthropic
    kind: vendor-primary
    evidence: PRIMARY
    url: https://www.anthropic.com/engineering/writing-tools-for-agents
    published: 2025-09-11
    retrieved: 2026-10-03
    recheck_after: 2027-04-03
    supports: [AO-004, AO-002]
    status: active
    quote: >-
      Tools are a new kind of software which reflects a contract between
      deterministic systems and non-deterministic agents.
    notes: >-
      Tool design as a contract is the framing. Contains the 40% decrease in task
      completion time from an agent that rewrites a flawed tool's own description,
      and the concrete bug where the web-search tool needlessly appended a year to
      queries — fixed by improving the description, not the model. Also the
      bloated-tool-set failure mode: "If a human engineer can't definitively say
      which tool should be used in a given situation, an AI agent can't be
      expected to do better."

  - id: S-007
    key: anthropic-demystifying-evals
    title: "Demystifying evals for AI agents"
    org: Anthropic
    kind: vendor-primary
    evidence: PRIMARY
    url: https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents
    published: 2026-01-09
    retrieved: 2026-10-03
    recheck_after: 2027-04-03
    supports: [PP-005, PP-016, PP-017, AO-007, AO-009, AO-012]
    status: active
    quote: >-
      A flight-booking agent might say "Your flight has been booked" at the end of
      the transcript, but the outcome is whether a reservation exists in the
      environment's SQL database.
    notes: >-
      The transcript-vs-outcome distinction, which is the load-bearing idea for
      AO-007/AO-009. Also: "When we evaluate 'an agent,' we're evaluating the
      harness and the model working together"; the trial concept exists because
      outputs vary between runs; grader taxonomy is code-based / model-based /
      human. The Opus-4.5-found-a-policy-loophole example is a caution that
      agentic benchmarks are non-stationary because the agent changes.

  - id: S-008
    key: anthropic-model-context-protocol-launch
    title: "Introducing the Model Context Protocol"
    org: Anthropic
    kind: vendor-primary
    evidence: PRIMARY
    url: https://www.anthropic.com/news/model-context-protocol
    published: 2024-11-25
    retrieved: 2026-10-03
    recheck_after: never
    supports: [AO-005]
    status: active
    notes: >-
      Historical anchor for MCP's start date, cited in the MCP timeline
      (AO-005). Announcement post; the normative content is the spec (S-030).

  - id: S-009
    key: anthropic-claude-agent-sdk
    title: "Building agents with the Claude Agent SDK"
    org: Anthropic
    kind: vendor-primary
    evidence: PRIMARY
    url: https://www.anthropic.com/engineering/building-agents-with-the-claude-agent-sdk
    published: 2025-09-29
    retrieved: 2026-10-03
    recheck_after: 2027-04-03
    supports: [AO-002, AO-012]
    status: active
    notes: >-
      Cited for the emergence of the "harness" as a named layer distinct from the
      model and the framework. Consultative for AEGIS; the repo's own runtime is
      stdlib-only by necessity (no pip egress on the compute nodes).

  # ------------------------------------------------------------------
  # Vendor primary — OpenAI
  # ------------------------------------------------------------------

  - id: S-010
    key: openai-practical-guide-to-building-agents
    title: "A practical guide to building agents"
    org: OpenAI
    kind: vendor-primary
    evidence: PRIMARY
    url: https://cdn.openai.com/business-guides-and-resources/a-practical-guide-to-building-agents.pdf
    published: 2025
    retrieved: 2026-10-03
    recheck_after: 2027-04-03
    supports: [AO-001, AO-002, AO-004, AO-009, AO-011, AO-012]
    status: active
    quote: >-
      Agents are systems that independently accomplish tasks on your behalf.
    notes: >-
      Read as a PDF from cdn.openai.com, which is reachable; the equivalent
      openai.com landing page returned HTTP 403 this pass. Undated within the
      year. Carries the three-condition build test (complex decisions, hard-to-
      maintain rules, heavy unstructured data) and the conclusion "Otherwise, a
      deterministic solution may suffice" — the same conclusion ADR-010 D1 reached
      independently. Guardrail scope limits (input guards first agent only, output
      guards last agent only, tool guards every call) are the concrete
      multi-agent security pitfall in AO-011.

  - id: S-011
    key: openai-agents-sdk-orchestration
    title: "Agents SDK - Agent orchestration"
    org: OpenAI
    kind: framework-doc
    evidence: PRIMARY
    url: https://openai.github.io/openai-agents-python/multi_agent/
    published: 2026
    retrieved: 2026-10-03
    recheck_after: 2027-04-03
    supports: [AO-002, AO-011, AO-012]
    status: active
    notes: >-
      Manager pattern and "agents as tools"; the manager owns the final answer,
      combines specialists, and centralises SDK guardrails. Also documents Sandbox
      agents with a Manifest / Permissions / SnapshotSpec and declared
      Capabilities — the AO-011 sandboxing primitive.

  - id: S-012
    key: openai-agents-sdk-handoffs
    title: "Agents SDK - Handoffs"
    org: OpenAI
    kind: framework-doc
    evidence: PRIMARY
    url: https://openai.github.io/openai-agents-python/handoffs/
    published: 2026
    retrieved: 2026-10-03
    recheck_after: 2027-04-03
    supports: [AO-002]
    status: active
    notes: >-
      Handoffs are tools to the LLM, with on_handoff callbacks, custom input_type
      schemas and input filters controlling what crosses the boundary. The input
      filter is the direct mechanism behind the context-truncation failure mode
      described in AO-002 / S-045.

  - id: S-013
    key: openai-agents-sdk-guardrails
    title: "Agents SDK - Guardrails"
    org: OpenAI
    kind: framework-doc
    evidence: PRIMARY
    url: https://openai.github.io/openai-agents-python/guardrails/
    published: 2026
    retrieved: 2026-10-03
    recheck_after: 2027-04-03
    supports: [AO-011]
    status: active
    quote: >-
      Think of guardrails as a layered defense mechanism. While a single one is
      unlikely to provide sufficient protection, using multiple, specialized
      guardrails together creates more resilient agents.
    notes: >-
      Tripwires and blocking vs parallel/optimistic execution modes; the blocking
      mode is the one that guarantees the expensive model never starts. Tool risk
      ratings (low / medium / high, from read-only vs write, reversibility,
      required permissions, financial impact) are the allowlist primitive used in
      AO-011 / AO-012.

  - id: S-014
    key: openai-structured-outputs-guide
    title: "Structured model outputs"
    org: OpenAI
    kind: infrastructure-doc
    evidence: PRIMARY
    url: https://platform.openai.com/docs/guides/structured-outputs
    published: 2026
    retrieved: 2026-10-03
    recheck_after: 2027-04-03
    supports: [PP-008]
    status: active
    quote: >-
      In some cases, the model might not generate a valid response that matches
      the provided JSON schema. This can happen in the case of a refusal, if the
      model refuses to answer for safety reasons, or if for example you reach a
      max tokens limit and the response is incomplete.
    notes: >-
      Living documentation, no fixed publication date. The documented escape
      hatches are the whole point for PP-008: schema adherence is guaranteed,
      completeness and non-refusal are not, and both must be handled in code.
      A pipeline that treats schema adherence as implying completeness will
      silently ship truncated artifacts. Supports only the types String, Number,
      Boolean, Integer, Object, Array, Enum, anyOf; allOf / not / if-then-else
      produce an error under strict:true. Append .md to the URL for plain
      markdown rendering.

  - id: S-015
    key: openai-agents-guide-web
    title: "A practical guide to building AI agents (web page)"
    org: OpenAI
    kind: vendor-primary
    evidence: UNVERIFIED
    url: https://openai.com/business/guides-and-resources/a-practical-guide-to-building-ai-agents/
    published: 2025
    retrieved: 2026-10-03
    recheck_after: 2026-11-03
    supports: []
    status: unused
    notes: >-
      Returned HTTP 403 on every attempt this pass. The content is assumed to be
      the same document as S-010, which WAS read as a PDF from cdn.openai.com.
      Listed so the 403 is recorded rather than silently forgotten. Carries no
      quote (R7) and is cited nowhere. Delete once the page is reachable.

  # ------------------------------------------------------------------
  # Standards and protocols
  # ------------------------------------------------------------------

  - id: S-030
    key: mcp-spec-2025-06-18
    title: "Model Context Protocol specification, revision 2025-06-18"
    org: Model Context Protocol
    kind: standard
    evidence: PRIMARY
    url: https://modelcontextprotocol.io/specification/2025-06-18
    published: 2025-06-18
    retrieved: 2026-10-03
    recheck_after: never
    supports: [AO-005, AO-011]
    status: active
    quote: >-
      Descriptions of tool behavior such as annotations should be considered
      untrusted, unless obtained from a trusted server.
    notes: >-
      Frozen, versioned specification — recheck_after: never. The normative
      sentence that anchors AO-011: the protocol itself says tool descriptions
      are untrusted input. Also the sampling consent rules.

  - id: S-031
    key: mcp-changelog-2025-11-25
    title: "MCP specification key changes, revision 2025-11-25"
    org: Model Context Protocol
    kind: standard
    evidence: PRIMARY
    url: https://modelcontextprotocol.io/specification/2025-11-25/changelog
    published: 2025-11-25
    retrieved: 2026-10-03
    recheck_after: never
    supports: [AO-005, AO-011, AO-012]
    status: active
    quote: >-
      Input validation errors should be returned as Tool Execution Errors rather
      than Protocol Errors to enable model self-correction.
    notes: >-
      Frozen, versioned. SEP-1303 is a protocol-level concession that agent loops
      must be able to self-correct — the protocol treats recoverability as a
      requirement, not a courtesy. The repo's L0 repair retry (steps.py) is the
      same idea without the protocol.

  - id: S-032
    key: mcp-spec-2026-07-28
    title: "The 2026-07-28 Model Context Protocol specification"
    org: Model Context Protocol
    kind: standard
    evidence: PRIMARY
    url: https://blog.modelcontextprotocol.io/posts/2026-07-28/
    published: 2026-07-28
    retrieved: 2026-10-03
    recheck_after: never
    supports: [AO-005, AO-012]
    status: active
    quote: >-
      If your server needs to carry state across calls, mint an explicit handle
      from a tool and have the model pass it back as an argument. We found this
      works better than session state hidden in the transport — the model can see
      the handle and thread it between tools.
    notes: >-
      Frozen, versioned — the largest protocol change to date. The protocol core
      went stateless: initialize/initialized and Mcp-Session-Id are retired, so any
      request can land on any instance behind a round-robin load balancer. The
      quote above is the load-bearing admission for AO-012: hidden orchestration
      state in the transport is the wrong abstraction for an agent. That is
      precisely the repo's "disk state is authoritative, transcript is a
      checkpoint" invariant, arrived at from the other direction.

  - id: S-033
    key: mcp-2026-roadmap
    title: "The 2026 MCP roadmap"
    org: Model Context Protocol
    kind: standard
    evidence: PRIMARY
    url: https://blog.modelcontextprotocol.io/posts/2026-mcp-roadmap/
    published: 2026-03-09
    retrieved: 2026-10-03
    recheck_after: 2027-03-09
    supports: [AO-005, AO-013]
    status: active
    notes: >-
      Audit trails are named as one of four top-priority enterprise gaps, with the
      explicit expectation that fixes land as extensions rather than core spec
      changes. The roadmap is organised by priority area rather than by date —
      acknowledged uncertainty about predictability in standards work. A2A and
      MCP agree that audit is not yet solved.

  - id: S-034
    key: a2a-launch
    title: "Announcing the Agent2Agent Protocol (A2A)"
    org: Google
    kind: vendor-primary
    evidence: PRIMARY
    url: https://developers.googleblog.com/en/a2a-a-new-era-of-agent-interoperability/
    published: 2025-04-09
    retrieved: 2026-10-03
    recheck_after: never
    supports: [AO-005]
    status: active
    notes: >-
      Frozen announcement, 50+ partners. Design principle worth carrying: A2A
      enables true multi-agent scenarios "without limiting an agent to a 'tool'" —
      the vertical/horizontal distinction is the actual content.

  - id: S-035
    key: a2a-specification-v1
    title: "Agent2Agent Protocol specification, v1.0"
    org: Agentic AI Foundation (Linux Foundation)
    kind: standard
    evidence: PRIMARY
    url: https://a2a-protocol.org/latest/specification/
    published: 2026
    retrieved: 2026-10-03
    recheck_after: 2027-04-03
    supports: [AO-005, AO-010]
    status: active
    notes: >-
      Three protocol bindings (JSON-RPC, gRPC, HTTP+JSON/REST), IANA media type
      application/a2a+json, A2A-Version and A2A-Extensions headers, and Agent Card
      signing. The signing is the first real agent-identity primitive in either
      protocol; there is still no cross-protocol identity standard (AO-013).

  - id: S-036
    key: a2a-and-mcp
    title: "A2A and MCP"
    org: Agentic AI Foundation (Linux Foundation)
    kind: standard
    evidence: PRIMARY
    url: https://a2a-protocol.org/latest/topics/a2a-and-mcp/
    published: 2026
    retrieved: 2026-10-03
    recheck_after: 2027-04-03
    supports: [AO-005]
    status: active
    quote: >-
      MCP is vertical. It deepens a single agent. A2A is horizontal. It connects
      agents across that boundary.
    notes: >-
      The cleanest available statement of the interop split, with a usable domain
      test: MCP-domain things are stateless functions with well-defined structured
      inputs/outputs; A2A-domain things reason, plan, keep state over long
      interactions and hold multi-turn dialogues.

  - id: S-037
    key: acp-merged-into-a2a
    title: "Agent Communication Protocol — now part of A2A"
    org: Agent Communication Protocol (IBM/BeeAI)
    kind: standard
    evidence: PRIMARY
    url: https://agentcommunicationprotocol.dev/introduction
    published: 2026
    retrieved: 2026-10-03
    recheck_after: never
    supports: [AO-005, AO-013]
    status: superseded
    superseded_by: S-035
    quote: >-
      ACP is now part of A2A under the Linux Foundation.
    notes: >-
      The landing page leads with its own supersession. Retained as the worked
      example for check R6 (superseded_by chain) and as ecosystem evidence: a
      second reasonable agent-interop protocol was absorbed within roughly 18
      months. Interop consolidation is happening by merger, not coexistence.

  # ------------------------------------------------------------------
  # Infrastructure / runtime documentation (local inference)
  # ------------------------------------------------------------------

  - id: S-040
    key: llamacpp-server-readme
    title: "llama.cpp llama-server README"
    org: ggml-org
    kind: infrastructure-doc
    evidence: PRIMARY
    url: https://github.com/ggml-org/llama.cpp/blob/master/tools/server/README.md
    published: 2026
    retrieved: 2026-10-03
    recheck_after: 2026-11-03
    supports: [PP-008, PP-009, PP-010, PP-011, PP-012, AO-012]
    status: active
    quote: >-
      Because (depending on the backend) the logits are not guaranteed to be
      bit-for-bit identical for different batch sizes (prompt processing vs.
      token generation) enabling this option can cause nondeterministic results.
    notes: >-
      Living document on master, rechecked monthly. The quote is about
      cache_prompt and is the sharpest tension in this registry: the flag that
      saves prompt-processing time is the one the vendor documents as breaking
      reproducibility, because prefix reuse is what varies batch composition
      between otherwise-identical requests. Also the source of the defaults that
      matter: --seed default -1 (random), --temp default 0.80, --context-shift
      disabled by default, --parallel slots, and the `truncated` response field
      which is the primary-source answer to silent truncation (PP-012). Living
      vendor doc: recheck on a 1-month cadence, not 6.

  - id: S-041
    key: ollama-api
    title: "Ollama API documentation"
    org: Ollama
    kind: infrastructure-doc
    evidence: PRIMARY
    url: https://github.com/ollama/ollama/blob/main/docs/api.md
    published: 2026
    retrieved: 2026-10-03
    recheck_after: 2026-11-03
    supports: [PP-009, PP-011, PP-012]
    status: active
    notes: >-
      One of the four Ollama pages that disagree with each other on num_ctx (see
      S-042 notes). Documents seed ("For reproducible outputs, set seed to a
      number", default 0) and num_predict (default -1, infinite). Monthly
      recheck.

  - id: S-042
    key: ollama-context-length
    title: "Ollama context length documentation"
    org: Ollama
    kind: infrastructure-doc
    evidence: PRIMARY
    url: https://github.com/ollama/ollama/blob/main/docs/context-length.mdx
    published: 2026
    retrieved: 2026-10-03
    recheck_after: 2026-11-03
    supports: [PP-009, PP-011, PP-012, PP-021]
    status: active
    notes: >-
      The cleanest available evidence for PP-021's version-drift anti-pattern:
      four Ollama documentation files live simultaneously and give three
      different num_ctx defaults. faq.mdx says 4096; modelfile.mdx says 2048;
      api.md shows 1024 in an example; this page gives a VRAM-tiered ladder
      (<24 GiB: 4k, 24-48 GiB: 32k, >=48 GiB: 256k). The docs were not wrong
      about intent; they were stale relative to each other. Also recommends at
      least 64000 tokens for "web search, agents, and coding tools". The
      operational consequence for AEGIS: never rely on an implicit runtime
      default — set num_ctx explicitly and assert it.

  - id: S-043
    key: vllm-batch-invariance
    title: "vLLM — Batch Invariance"
    org: vLLM project
    kind: infrastructure-doc
    evidence: PRIMARY
    url: https://docs.vllm.ai/en/latest/features/batch_invariance/
    published: 2026
    retrieved: 2026-10-03
    recheck_after: 2026-11-03
    supports: [PP-011]
    status: active
    quote: >-
      Batch invariance ensures that the output of a model is deterministic and
      independent of the batch size or the order of requests in a batch.
    notes: >-
      The only first-class determinism control found in any of the ecosystems
      surveyed, and it does not exist in llama.cpp or Ollama. Enables with
      VLLM_BATCH_INVARIANT=1. Beta; the doc's own example still passes
      temperature=0.7 AND seed=42, so batch invariance and seeding are orthogonal
      controls. Requires NVIDIA compute capability 8.0+; on XPU the Triton
      Attention backend is mandatory.

  - id: S-044
    key: vllm-structured-outputs
    title: "vLLM — Structured outputs"
    org: vLLM project
    kind: infrastructure-doc
    evidence: PRIMARY
    url: https://docs.vllm.ai/en/latest/features/structured_outputs/
    published: 2026
    retrieved: 2026-10-03
    recheck_after: 2026-11-03
    supports: [PP-008]
    status: active
    notes: >-
      Uses xgrammar or guidance as backends, default auto. Records a real
      portability trap for PP-008: the regex dialect differs by backend
      ("xgrammar, guidance, and outlines use Rust-style regex, while
      lm-format-enforcer uses Python's re module"). Also documents that
      guided_json / guided_regex / guided_choice / guided_grammar /
      guided_whitespace_pattern / structural_tag / guided_decoding_backend were
      all removed in v0.12.0 — API churn is real. Not currently applicable to
      AEGIS (the repo runs Ollama, not vLLM); cited as the migration target if
      the determinism gap ever justifies changing the serving layer.

  - id: S-045
    key: xgrammar
    title: "XGrammar"
    org: MLC AI
    kind: infrastructure-doc
    evidence: PRIMARY
    url: https://github.com/mlc-ai/xgrammar
    published: 2026
    retrieved: 2026-10-03
    recheck_after: 2026-11-03
    supports: [PP-008]
    status: active
    quote: >-
      It leverages constrained decoding to ensure 100% structural correctness of
      the output. It has achieved near-zero overhead in JSON generation.
    notes: >-
      The constrained-decoding primitive that the higher-level tools build on.
      Default structured-generation backend for vLLM (2024-12), SGLang (2024-11),
      TensorRT-LLM (2025-01), Modular MAX (2025-02), OpenVINO GenAI (2025-09).
      Technical report arXiv:2411.15100. "Near-zero overhead" is measured against
      XGrammar's own optimised path; the generality claim across Qwen / Llama /
      DeepSeek / Phi / Gemma is the load-bearing part for AEGIS, since it means
      the failure mode is removed rather than hoped for.

  - id: S-046
    key: outlines
    title: "Outlines"
    org: .txt AI
    kind: infrastructure-doc
    evidence: PRIMARY
    url: https://github.com/outlines-dev/outlines
    published: 2026
    retrieved: 2026-10-03
    recheck_after: 2026-11-03
    supports: [PP-008]
    status: active
    quote: >-
      Most solutions attempt to fix bad outputs after generation using parsing,
      regex, or fragile code that breaks easily. Outlines guarantees structured
      outputs during generation — directly from any LLM.
    notes: >-
      The first sentence is the canonical statement of the post-hoc-parsing
      anti-pattern, which is exactly what AEGIS's fenced-block parsers do today.
      Provider independence across OpenAI / Ollama / vLLM is the reason it is
      cited at all given the repo is Ollama-only.

  - id: S-047
    key: guidance
    title: "Guidance"
    org: Microsoft
    kind: infrastructure-doc
    evidence: PRIMARY
    url: https://github.com/guidance-ai/guidance
    published: 2026
    retrieved: 2026-10-03
    recheck_after: 2026-11-03
    supports: [PP-008]
    status: active
    notes: >-
      Token-level constraint plus control flow, with llama.cpp among its
      backends. A different design point from Outlines rather than a competitor:
      the constraint is part of program control flow, not a schema translated
      into a decoding mask.

  - id: S-048
    key: lmql
    title: "LMQL"
    org: ETH Zurich (SRI Lab)
    kind: infrastructure-doc
    evidence: PRIMARY
    url: https://github.com/eth-sri/lmql
    published: 2026
    retrieved: 2026-10-03
