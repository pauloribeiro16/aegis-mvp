  # --- KG inside AI pipelines (KG-027 to KG-032) ---

  - id: S-247
    key: veritrail-derivation-dag-iclr-2026
    title: "VeriTrail: Detecting hallucination and tracing provenance in multi-step AI workflows"
    org: Microsoft Research; ICLR 2026
    kind: vendor-primary
    evidence: PRIMARY
    url: https://www.microsoft.com/en-us/research/blog/veritrail-detecting-hallucination-and-tracing-provenance-in-multi-step-ai-workflows/
    published: 2025-08-05
    retrieved: 2026-10-04
    recheck_after: 2027-04-04
    supports: [KG-027, KG-028, KG-029]
    status: active
    quote: >-
      A key idea leveraged by VeriTrail is that a wide range of generative
      processes can be represented as a directed acyclic graph (DAG). Each node
      in the DAG represents a piece of text (i.e., source material, an
      intermediate output, or the final output) and each edge from node A to node
      B indicates that A was used as an input to produce B.
    notes: >-
      The strongest single mechanism in the whole pipeline thread, and the
      reference implementation for KG-027. A GraphRAG run rendered as a SIX-
      STAGE DAG. Three design details transfer directly: (i) claims are
      verified in REVERSE of generative order, walking back toward source;
      (ii) sentence ids are assigned PROGRAMMATICALLY and any model-returned id
      that does not match is DISCARDED -- "This approach guarantees that the
      sentences included in the evidence trail are not hallucinated"; (iii) the
      search space narrows, since only the input nodes of nodes-from-which-
      evidence-was-selected are checked. On corpora over 100K tokens with an
      average of 114,368 nodes it beats AlignScore, INFUSE, RAG-as-detector,
      Gemini 1.5 Pro and GPT-4.1 mini. THE KEY PRODUCT INSIGHT FOR KG-029:
      traceability and error localisation are SEPARATE products -- a supported
      claim gets a path, an unsupported one gets a STAGE NUMBER, and that stage
      number is the operationally valuable output. CAVEAT: research purposes
      only, not available commercially, and the guarantee covers sentence IDS,
      not the truth of verdicts.

  - id: S-248
    key: provenanceai-citation-influence-gap
    title: "ProvenAI: Provenance-Native Traces of Evidence in Generated Answers"
    org: ProvenAI authors
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2606.26449
    published: 2026-06-24
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-027, KG-029]
    status: active
    quote: >-
      a worked example surfaces what we call the citation-influence gap: a clean
      citation audit co-occurring with a profile in which one cited source
      registers only weak influence while seven uncited sources demonstrably
      shift the output.
    notes: >-
      The finding that should govern how KG-027 is applied to a compliance
      corpus. Decomposes transparency into three INDEPENDENTLY MEASURED layers
      -- answer correctness, citation fidelity against benchmark gold, and
      PER-DOCUMENT INFLUENCE under leave-one-resource-out intervention -- and
      demonstrates they dissociate. Numbers: 53.53% answer accuracy, 71.55%
      citation fidelity on 7,405 HotpotQA-distractor examples. The operative
      rule for a regulated deployment: CITATION PRESENCE, CITATION
      CORRECTNESS, and CAUSAL INFLUENCE are three different properties and all
      three must be measured. A "clean citation audit" is not evidence that any
      cited source did the work.

  - id: S-249
    key: attribution-compression-frontier
    title: "The Attribution-Compression Frontier in Retrieval-Augmented Generation"
    org: Attribution-Compression authors
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2609.14245
    published: 2026-09-13
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-027, KG-029]
    status: active
    quote: >-
      a RECOMP-style compressor's citations score 0.86 precision against its
      summaries but 0.12 against source spans under our re-attributability
      protocol.
    notes: >-
      Compression silently destroys provenance, and the damage is measurable
      against a chosen reference. Citation precision scores 0.86 against the
      compressor's OWN SUMMARIES and 0.12 against SOURCE SPANS; claim
      verification after source recovery shows an unsupported rate of 0.88
      versus 0.17. Extractive selection grounds at 0.43-0.49. The consequence
      for a pipeline that must cite regulation verbatim is direct and
      uncomfortable: token-budget decisions are simultaneously provenance-budget
      decisions, and summary-level provenance metrics will look excellent while
      telling you nothing. The authors' own caveat, carried here: shared-NLI
      evaluator with no human calibration.

  - id: S-250
    key: kag-ant-group
    title: "KAG: Boosting LLMs in Professional Domains via Knowledge Augmented Generation"
    org: Ant Group
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2409.13731
    published: 2024-09-10
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-028, KG-031]
    status: active
    quote: >-
      we compared KAG with existing RAG methods in multihop question answering
      and found that it significantly outperforms state-of-the-art methods,
      achieving a relative improvement of 19.6% on 2wiki and 33.5% on hotpotQA
      in terms of F1 score.
    notes: >-
      The strongest production deployment found in the survey, and the closest
      analogue to a professional-domain (regulated, expert) setting. Two
      mechanisms matter and both are in the KG-028 lane: MUTUAL INDEXING
      between the knowledge graph and the original chunks, so every node keeps
      a source pointer, and a LOGICAL-FORM-GUIDED HYBRID REASONING ENGINE, which
      composes retrieval results through rule-like forms rather than
      concatenating them. The motivating gap is stated precisely: the distance
      between vector similarity and the relevance of knowledge reasoning, plus
      LLM insensitivity to "numerical values, temporal relations, expert rules".
      Those three categories are exactly what a regulatory corpus is made of,
      which is why KG-028 is the pattern AEGIS is most likely to want.

  - id: S-251
    key: evgraph-proof-carrying
    title: "EviGraph: Proof-Carrying Selective Recommendation over Temporal Public-Service Knowledge Graphs"
    org: EviGraph authors
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2610.00212
    published: 2026-09-21
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-028, KG-029]
    status: active
    quote: >-
      we distinguish critical decision requirements from information that can
      remain unresolved. A language agent links these requirements to evidence
      in a temporal knowledge graph, while a deterministic checker establishes
      whether a recommendation is supported.
    notes: >-
      The most important caution in the pipeline thread, and the source of
      KG-029's spec-first rule: "Additional verification, however, can withdraw
      supported recommendations without improving decision quality." The
      corrective is the design principle for a deterministic gate: reliable
      evidence-based navigation depends on SPECIFYING WHAT MUST BE ESTABLISHED
      FOR A DECISION rather than simply adding more verification. A deterministic
      checker over graph state is the mechanism; the enumerated requirement set
      must exist first, or the checker has no contract. For AEGIS this is the
      published counterpart to the repo's R6/R7 discipline and to
      `check_traceability.py` T1-T6 -- the requirement list is the spec, the
      checker is downstream of it.

  - id: S-252
    key: disasterlex-schema-restriction
    title: "DisasterLex: An Expert Concept-to-Schema Knowledge Graph for Geospatial Reasoning in Disaster Analytics"
    org: DisasterLex authors
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2605.30538
    published: 2026-05-28
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-028]
    status: active
    quote: >-
      introduces a knowledge-graph-mediated framework that inserts an Expert
      Knowledge Graph (EKG) of curated concepts and typed causal edges between
      the user query and the database, bridged to schema by concept-to-table
      links.
    notes: >-
      The closest published analogue to constraining a derivation step with a
      domain taxonomy, which is the AEGIS use case. Four stages -- identify query
      entities, route to operational domain, plan over causal edges, ground the
      SQL -- with the effect of RESTRICTING THE SCHEMA PASSED TO THE MODEL AT
      EACH STAGE. That is the important mechanism: the graph reduces the
      EXPRESSIBLE space, not merely the retrieved space, which is a stronger
      guarantee than anything in the retrieval lane. Honest limitation: schema
      restriction is only as good as the EKG's coverage, which is curated by
      hand -- the same coverage liability KG-022 measures elsewhere.

  - id: S-253
    key: memory-portability-fixed-schema
    title: "Does Your Agent's Memory Survive a Model Upgrade? A Controlled Study of Memory Portability"
    org: Memory Portability authors
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2609.05339
    published: 2026-09-04
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [KG-030, KG-032]
    status: active
    quote: >-
      Our measurements show that fixed-schema structures transfer reliably, with
      KG-fixed accuracy changing by only $+0.0004 \pm 0.0020$ following a writer
      swap.
    notes: >-
      The cleanest positive result for graph memory in the survey, and the one
      that answers a question nobody else measured. A fixed-schema knowledge
      graph survives swapping the model that writes into it -- accuracy moves by
      +0.0004 +/- 0.0020 -- while model-compressed note stores are highly
      model-coupled. This is an argument about the WRITE PATH being decoupled
      from the reader, not about retrieval quality. For AEGIS the relevance is
      narrow but real: a typed trace record keyed by stage and citation stays
      valid across a model change, whereas a free-text summary of the same
      stage does not.

