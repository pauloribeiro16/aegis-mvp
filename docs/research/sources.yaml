  - id: S-100
    key: wu-llm-agents-survey
    title: "The Rise and Potential of Large Language Model Based Agents: A Survey"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2309.07864
    published: 2023-09-14
    retrieved: 2026-10-03
    recheck_after: 2027-10-03
    supports: [AO-001, AO-002]
    status: active
    notes: >-
      Only the abstract was verified. The widely-cited six-archetype breakdown
      (profile, feed-forward, reflection, tool use, planning, multi-agent) was NOT
      confirmed from the paper body and is therefore not asserted anywhere in
      these documents. What the abstract does support: the brain / perception /
      action organising framework, applied across single-agent, multi-agent and
      human-agent cooperation. Note this is an ontological taxonomy, not the
      prescriptive design taxonomy of S-001; do not cite one as if it were the
      other.

  - id: S-101
    key: wang-self-consistency
    title: "Self-Consistency Improves Chain of Thought Reasoning in Language Models"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2203.11171
    published: 2022-03-21
    retrieved: 2026-10-03
    recheck_after: 2027-10-03
    supports: [PP-004]
    status: active
    notes: >-
      The mechanism is what transfers: sample diverse reasoning paths, then
      marginalise. The commonly-quoted GSM8K figures were NOT verified from the
      abstract (it says only "striking margin") and are not asserted here.

  - id: S-102
    key: kwon-pagedattention
    title: "Efficient Memory Management for Large Language Model Serving with PagedAttention"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2309.06180
    published: 2023-09-12
    retrieved: 2026-10-03
    recheck_after: 2027-10-03
    supports: [PP-009, PP-010]
    status: active
    notes: >-
      Background for PP-009/PP-010: KV cache memory is per-request, dynamic and
      fragmentation-prone, which is why prefix reuse and slot management exist as
      first-class serving concerns. Not applicable to the repo's current
      single-slot Ollama deployment; recorded because a scale change would
      trigger it.

  - id: S-103
    key: leviathan-speculative-decoding
    title: "Fast Inference from Transformers via Speculative Decoding"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2211.17192
    published: 2022-11-30
    retrieved: 2026-10-03
    recheck_after: 2027-10-03
    supports: [PP-009, PP-011]
    status: active
    quote: >-
      an algorithm to sample from autoregressive models faster without any changes
      to the outputs
    notes: >-
      Output-distribution-preserving, so it does not trade reproducibility for
      speed in theory. In practice changing the draft model changes the batching
      and therefore the numerics, which routes it back through PP-011.

  - id: S-104
    key: chen-cascades-vs-specdec
    title: "A Theoretical Understanding of Cascade versus Speculative Decoding"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2405.19261
    published: 2024-05-29
    retrieved: 2026-10-03
    recheck_after: 2027-05-03
    supports: [PP-019, PP-011]
    status: active
    quote: >-
      Cascades employ a deferral rule that invokes the larger model only for
      "hard" inputs, while speculative decoding uses speculative execution to
      primarily invoke the larger model in parallel verification mode.
    notes: >-
      The distinction that must not be blurred: cascades can empirically OUTPERFORM
      the large model (the small model rescues cases the large one gets wrong),
      while speculative decoding offers quality-neutrality BY THEOREM. If a
      regression guarantee is needed, spec-decode; if a cost win is needed,
      cascade. AEGIS needs the guarantee, not the win, at this stage.

  - id: S-105
    key: moe-speculation-ineffective
    title: "Utility-Driven Speculative Decoding for Mixture-of-Experts"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2506.20675
    published: 2025-06-17
    retrieved: 2026-10-03
    recheck_after: 2027-06-03
    supports: [PP-009]
    status: active
    notes: >-
      Recorded negative result: speculation is ineffective for MoE models, because
      draft tokens collectively activate more weights and erase the compute-idle
      advantage. Constrains which future model choice can benefit from
      speculative decoding.

  - id: S-106
    key: frugalgpt
    title: "FrugalGPT: How to Use Large Language Models While Reducing Cost and Improving Performance"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2305.05176
    published: 2023-05-09
    retrieved: 2026-10-03
    recheck_after: 2027-10-03
    supports: [PP-019]
    status: active
    notes: >-
      Three strategy families (prompt adaptation, LLM approximation, cascade) and
      the counterintuitive headline: a learned cascade can improve accuracy, not
      only cost. The specific cost-reduction and accuracy-up numbers were NOT
      verified (the abstract is truncated) and are not asserted.

  - id: S-107
    key: routellm
    title: "RouteLLM: Learning to Route LLMs with Preference Data"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2406.18665
    published: 2024-06-26
    retrieved: 2026-10-03
    recheck_after: 2027-06-03
    supports: [PP-019]
    status: active
    notes: >-
      Verified headline: significant cost reduction — "by over 2 times in certain
      cases — without compromising the quality of responses." The routing signal
      is preference data, not a difficulty classifier, which is a different design
      from FrugalGPT's learned combinator.

  - id: S-108
    key: route-llm-confidence-tokens
    title: "Learning to Route LLMs with Confidence Tokens"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2410.13284
    published: 2024-10-17
    retrieved: 2026-10-03
    recheck_after: 2027-04-17
    supports: [PP-019, AO-007]
    status: active
    notes: >-
      The abstention mechanism: know when the output may be unreliable, then
      route elsewhere OR fall back to a safe default. The safe-default arm is
      what the repo's G-P1-D human gate is, unrecognised as such.

  - id: S-109
    key: cost-saving-cascades-with-abstention
    title: "Cost-Saving LLM Cascades with Early Abstention"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2502.09054
    published: 2025-02-13
    retrieved: 2026-10-03
    recheck_after: 2027-02-13
    supports: [PP-019]
    status: active
    notes: >-
      The three-way route — small model answers / escalate to large / abstain to a
      human — is strictly more expressive than the two-way, and the abstain arm is
      the one most designs omit. For a regulated domain it is the arm that
      matters. Direct source for the missing-abstention gap in 03_PATTERN_MAPPING.

  - id: S-110
    key: cascade-failure-under-attack
    title: "When Efficiency Backfires: Cascading LLMs Trigger Cascade Failure under Adversarial Attack"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2605.17288
    published: 2026-05-17
    retrieved: 2026-10-03
    recheck_after: 2027-05-17
    supports: [PP-019, AO-011]
    status: active
    notes: >-
      The counterweight to S-106/S-107/S-109: cascades buy cost and buy attack
      surface, because the lightweight models in the cascade expand the surface.
      For a regulated domain that is a design input, not a footnote.

  - id: S-111
    key: zheng-judging-llm-as-judge
    title: "Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2306.05685
    published: 2023-06-09
    retrieved: 2026-10-03
    recheck_after: 2027-10-03
    supports: [PP-005, PP-016]
    status: active
    quote: >-
      position, verbosity, and self-enhancement biases, as well as limited
      reasoning ability
    notes: >-
      The origin of the named judge biases. Companion to S-112, which quantifies
      the worst of them.

  - id: S-112
    key: wang-llms-not-fair-evaluators
    title: "Large Language Models are not Fair Evaluators"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2305.17926
    published: 2023-05-29
    retrieved: 2026-10-03
    recheck_after: 2027-10-03
    supports: [PP-005, PP-016]
    status: active
    quote: >-
      the quality ranking of candidate responses can be easily hacked by simply
      altering their order of appearance in the context.
    notes: >-
      Quantified: a reordering that made Vicuna-13B beat ChatGPT on 66 of 80
      tested queries. The number to remember whenever pairwise judging is proposed
      on a contested comparison — including any future AEGIS A/B between the
      pipeline arm and the agent arm.

  - id: S-113
    key: liu-geval
    title: "G-Eval: NLG Evaluation using GPT-4 with Human Alignment"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2303.16634
    published: 2023-03-24
    retrieved: 2026-10-03
    recheck_after: 2027-10-03
    supports: [PP-005, PP-016]
    status: active
    notes: >-
      Form-filling paradigm with chain-of-thought. The reported finding is
      qualitative only (LLM evaluators have lower human correspondence than
      medium-size neural evaluators); no number is asserted here.

  - id: S-114
    key: rubric-artifacts-in-llm-judge
    title: "Judging LLM-as-a-Judge: Concerning Rubric Artifacts in LLM-based Automated Text Generation Evaluation"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2609.02942
    published: 2026-08-31
    retrieved: 2026-10-03
    recheck_after: 2027-08-31
    supports: [PP-005, PP-016, PP-021]
    status: active
    quote: >-
      Classifiers trained only on rubric text, without access to any evaluated
      response, achieve nontrivial predictive performance on judge outputs.
    notes: >-
      The most consequential 2026 result for any rubric-based judge, and the
      reason the repo's L3 layer is currently uninterpretable rather than merely
      weak. Practical consequences: a judge may be scoring the rubric; changing
      rubric text is a confound, not a neutral refactor; and a rubric-text-only
      baseline is now a mandatory control in any judge experiment. The L2
      human-scoring table in EXP-01 is empty precisely because this control was
      not run.

  - id: S-115
    key: choma-context-rot
    title: "Context Rot: How Increasing Input Tokens Impacts LLM Performance"
    org: Chroma
    kind: vendor-primary
    evidence: PRIMARY
    url: https://research.trychroma.com/context-rot
    published: 2025
    retrieved: 2026-10-03
    recheck_after: 2027-04-03
    supports: [PP-013]
    status: active
    quote: >-
      We demonstrate that even under these minimal conditions, model performance
      degrades as input length increases, often in surprising and non-uniform ways.
    notes: >-
      Vendor research with a commercial interest in retrieval — the framing is
      advocacy, the measurements are data. The methodological contribution is what
      matters: the study holds task complexity constant while varying only input
      length, which is rarely done correctly. Its critique of needle-in-a-
      haystack is the load-bearing point — NIAH "assesses direct lexical
      matching, which may not be representative of flexible, semantically
      oriented tasks".

  - id: S-116
    key: liu-lost-in-the-middle
    title: "Lost in the Middle: How Language Models Use Long Contexts"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2307.03172
    published: 2023-07-06
    retrieved: 2026-10-03
    recheck_after: 2027-10-03
    supports: [PP-013]
    status: active
    quote: >-
      performance is often highest when relevant information is at the beginning
      or end of the context
    notes: >-
      The U-curve. Directly applicable to the repo, which already places the
      code-owned next-step directive at the END of the agent context and cites
      this at loop.py:328.

  - id: S-117
    key: lost-in-middle-emergent-property
    title: "Lost in the Middle: An Emergent Property from Information Retrieval Demands in LLMs"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2510.10276
    published: 2025-10-11
    retrieved: 2026-10-03
    recheck_after: 2027-10-11
    supports: [PP-013]
    status: active
    notes: >-
      CONTESTED against S-115/S-004. Argues the U-curve is an adaptation to
      training-distribution retrieval demands rather than a defect to engineer
      around. Both readings fit the data; the practical advice is identical
      (place critical material at the edges) but the framing decides whether you
      treat it as a benchmark artifact or a law. Recorded so the disagreement is
      visible rather than smoothed over.

  - id: S-118
    key: loca-bench
    title: "LOCA-bench: Benchmarking Language Agents Under Controllable and Extreme Context Growth"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2602.07962
    published: 2026-02-08
    retrieved: 2026-10-03
    recheck_after: 2027-02-08
    supports: [PP-013, AO-003]
    status: active
    notes: >-
      Argues existing long-context benchmarks "primarily focus on single-step
      settings" while agents need evaluation "under a dynamically growing
      context" — the exact shape of the AEGIS agent arm, whose context grows
      every turn.

  - id: S-119
    key: evaluating-chunking-strategies
    title: "Evaluating Chunking Strategies for Retrieval-Augmented Generation on Academic Texts"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2607.01852
    published: 2026-07-02
    retrieved: 2026-10-03
    recheck_after: 2027-07-02
    supports: [PP-014]
    status: active
    notes: >-
      Two things, one of them a negative result about the instrument: RAGAS
      faithfulness "shows limited reliability in this setup". Any chunking claim
      inherited from a default, including a vendor default, is weaker than it
      looks. There is no settled answer to optimal chunk size.

  - id: S-120
    key: chunk-size-rag
    title: "The Effect of Text Chunk Size on Retrieval-Augmented Generation Performance"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2607.24767
    published: 2026-06-08
    retrieved: 2026-10-03
    recheck_after: 2027-06-08
    supports: [PP-014]
    status: active
    notes: >-
      Confirms chunk granularity is a critical and under-explored component. Both
      this and S-119 are small/preliminary; the honest reading is that chunking
      is unmeasured in this domain, not that any particular size is correct.

  - id: S-121
    key: khattab-colbert
    title: "ColBERT: Efficient and Effective Passage Search via Contextualized Late Interaction over BERT"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2004.12832
    published: 2020-04-27
    retrieved: 2026-10-03
    recheck_after: never
    supports: [PP-014]
    status: active
    notes: >-
      The late-interaction primitive: per-token document embeddings scored with
      MaxSim at query time. Largely superseded in practice by learned rerankers,
      but the mechanism is what S-122 and S-123 analyse.

  - id: S-122
    key: late-interaction-capacity
    title: "Quantifying and Expanding the Theoretical Capacity of Late-Interaction Retrieval Models"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2607.05803
    published: 2026-07-07
    retrieved: 2026-10-03
    recheck_after: 2027-07-07
    supports: [PP-014]
    status: active
    notes: >-
      MaxSim similarity can exactly replicate the inner product between any two
      non-negative k-sparse vectors — MaxSim is strictly more expressive than a
      single-vector dot product, which explains its empirical edge.

  - id: S-123
    key: spike-hijacking-late-interaction
    title: "Spike Hijacking in Late-Interaction Retrieval"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2604.05253
    published: 2026-04-06
    retrieved: 2026-10-03
    recheck_after: 2027-04-06
    supports: [PP-014, AO-011]
    status: active
    notes: >-
      The winner-take-all pooling rule induces higher patch-level gradient
      concentration than smoother alternatives. A documented attack surface, and
      a caveat against treating MaxSim robustness as free.

  # ------------------------------------------------------------------
  # Preprints — multi-agent failure modes and verification
  # ------------------------------------------------------------------

  - id: S-130
    key: mast-why-multi-agent-fail
    title: "Why Do Multi-Agent LLM Systems Fail?"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2503.13657
    published: 2025-03-17
    retrieved: 2026-10-03
    recheck_after: 2027-03-17
    supports: [AO-006, AO-007, AO-009]
    status: active
    quote: >-
      Despite enthusiasm for Multi-Agent LLM Systems (MAS), their performance
      gains on popular benchmarks are often minimal.
    notes: >-
      1,600+ annotated traces across 7 MAS frameworks. 14 failure modes in 3
      categories — system design, inter-agent misalignment, task verification —
      built from 150 expert-annotated traces at Cohen's kappa 0.88, then scaled
      with an LLM-as-a-Judge pipeline. The load-bearing finding is the three-way
      split: one in three failures is a VERIFICATION failure, not a reasoning
      failure. That is why the field's answer is verify-gated design rather than
      better decomposition.

  - id: S-131
    key: science-of-scaling-agent-systems
    title: "Towards a Science of Scaling Agent Systems"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2512.08296
    published: 2025-12-09
    retrieved: 2026-10-03
    recheck_after: 2027-12-09
    supports: [AO-006, AO-002]
    status: active
    notes: >-
      260 configurations, 6 agentic benchmarks, 5 architectures (single-agent
      plus independent, centralized, decentralized, hybrid multi-agent), 3 LLM
      families, tools/prompts/compute standardised to isolate the architectural
      effect. Predictive model with cross-validated R-squared 0.373. Reports a
      capability-saturation effect: coordination yields diminishing returns once
      single-agent performance is already high. The best available answer to
      "does multi-agent help" — it helps in a specific, bounded region.

  - id: S-132
    key: oneflow-single-agent-baseline
    title: "Rethinking the Value of Multi-Agent Workflow: A Strong Single Agent Baseline"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2601.12307
    published: 2026-01-18
    retrieved: 2026-10-03
    recheck_after: 2027-01-18
    supports: [AO-006, AO-002]
    status: active
    quote: >-
      A single agent can reach the performance of homogeneous workflows with an
      efficiency advantage from KV cache reuse, and can even match the performance
      of an automatically optimized heterogeneous workflow.
    notes: >-
      Seven benchmarks (coding, math, QA, domain reasoning, planning/tool use).
      The consequence that matters for AEGIS: the diversity a homogeneous
      multi-agent system appears to provide is often not real diversity, because
      all workers share the base model's priors.

  - id: S-133
    key: idraak-single-call-six-fewshot
    title: "IDRAAK"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2608.08801
    published: 2026-08-09
    retrieved: 2026-10-03
    recheck_after: 2027-08-09
    supports: [AO-006, PP-016]
    status: active
    notes: >-
      A single LLM call with six few-shot examples achieving MCC 0.888 and F1
      0.983, outperforming the evaluated structured and multi-stage alternatives
      including multi-agent verification. The strongest single data point for
      "try the simple thing first, and mean it".

  - id: S-134
    key: false-success-llm-agents
    title: "From Confident Closing to Silent Failure: Characterizing False Success in LLM Agents"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2606.09863
    published: 2026-06-01
    retrieved: 2026-10-03
    recheck_after: 2027-06-01
    supports: [AO-007, AO-009, PP-005, PP-017]
    status: active
    quote: >-
      Across 5 judges, 5 prompt strategies, and full task specifications, no
      configuration exceeds AUROC 0.65 on the benchmark; the same judges reach
      only 0.54 AUROC on application traces.
    notes: >-
      Across 9,876 tau-squared-bench trajectories (8 model families) and 1,879
      AppWorld trajectories. False success is 45-48% of failures in single-control
      domains, 3% in the dual-control telecom domain, and 75.8% among AppWorld
      self-assessing coding-agent trajectories with explicit status claims. The
      judges rely on "surface completion proxies — confident closing language
      and coarse action-sequence volume — rather than verified state changes",
      while a lightweight TF-IDF detector reaches 0.83 AUROC. THE central result
      for AO-007: you cannot detect silent failure by asking the model whether it
      succeeded.

  - id: S-135
    key: mas-fire-silent-semantic-failure
    title: "MAS-FIRE"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2602.19843
    published: 2026-02-23
    retrieved: 2026-10-03
    recheck_after: 2027-02-23
    supports: [AO-006, AO-007]
    status: active
    notes: >-
      Because multi-agent systems coordinate through unstructured natural language
      rather than rigid protocols, they are prone to semantic failures that
      "propagate silently without raising runtime exceptions". Defines a 15-type
      fault taxonomy. The mechanism behind S-132: coordination over prose is
      exactly the channel the repo's typed artifacts and file-state gates exist
      to avoid.

  - id: S-136
    key: dover-attribution
    title: "DoVer"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2512.06749
    published: 2025-12-07
    retrieved: 2026-10-03
    recheck_after: 2027-12-07
    supports: [AO-006, AO-010]
    status: active
    notes: >-
      Single-step or single-agent attribution is often ill-posed, because multiple
      distinct interventions can independently repair a failed task; log-only
      localisation produces untested hypotheses. The direct argument for the
      repo's artifact-presence resume being deterministic rather than inferred —
      the runner does not localise a failure, it re-enters at the artifact.

  - id: S-137
    key: codecor-pruning-intermediate-outputs
    title: "CodeCoR"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2501.07811
    published: 2025-01-14
    retrieved: 2026-10-03
    recheck_after: 2027-01-14
    supports: [AO-006, PP-020]
    status: active
    notes: >-
      The performance of a workflow is not robust, because code generation depends
      on every agent in the chain; the fix is pruning intermediate outputs to
      reduce propagation. Independent support for the same conclusion S-005 reaches
      by a different route.

  - id: S-138
    key: codecrdt-coordination-cost
    title: "CodeCRDT"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2510.18893
    published: 2025-10-18
    retrieved: 2026-10-03
    recheck_after: 2027-10-17
    supports: [AO-002, AO-006]
    status: active
    notes: >-
      Multi-agent LLM systems fail to realise parallel speedups due to costly
      coordination; the proposed observation-driven shared-state pattern with
      deterministic convergence still reports 5-10% semantic conflict rates, up
      to 21.1% speedup and up to 39.4% slowdown depending on the task. Coordination
      is not free even in its best observed form.

  - id: S-139
    key: coopetitive-error-propagation
    title: "CoopetitiveV"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2412.11014
    published: 2024-12-15
    retrieved: 2026-10-03
    recheck_after: 2027-12-15
    supports: [AO-006]
    status: active
    notes: >-
      Names the mechanism plainly: in cooperation-only multi-agent pipelines,
      erroneous information from the former agent is propagated to the latter
      through prompts. Sequential cooperation is a chain of trust with no checks —
      which is the multi-agent reading of the chain defect documented at commit
      0654bf1.

  - id: S-140
    key: agentark-debate-cost
    title: "AgentArk"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2602.03955
    published: 2026-02-03
    retrieved: 2026-10-03
    recheck_after: 2027-02-03
    supports: [AO-006, AO-002]
    status: active
    notes: >-
      Distils iterative debate into a single agent, explicitly citing high
      computational cost and error propagation as the motivation. A third
      independent line converging on "don't orchestrate, restructure".

  - id: S-141
    key: fase-error-propagation-survey
    title: "FASE"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2606.09800
    published: 2026-06-08
    retrieved: 2026-10-03
    recheck_after: 2027-06-08
    supports: [AO-006]
    status: active
    notes: >-
      System reliability remains hindered by hallucination and "error propagation
      across interacting agents". Used as corroboration, not as a distinct claim.

  - id: S-142
    key: verify-gated-completion
    title: "Verify-Gated Completion as Admission Control in a Governed Multi-Agent Runtime"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2605.17998
    published: 2026-05-18
    retrieved: 2026-10-03
    recheck_after: 2027-05-18
    supports: [AO-007, AO-012, PP-018]
    status: active
    quote: >-
      Agents may propose completion, but a read-only verifier decides whether the
      claim is admitted. Ambiguous or weakly evidenced cases resolve fail-closed.
    notes: >-
      A bounded case study, self-described as such; treat as a design pattern, not
      a validated result. Reported 1,791/1,800 = 99.5% verify success on the
      released known-outcome slice, with ambiguous cases the open problem. The
      fail-closed default is the transferable part.

  - id: S-143
    key: mas-process-models-evaluation
    title: "Evaluating Software Process Models for Multi-Agent Class-Level Code Generation"
    org: arXiv
    kind: preprint
    evidence: PEER
    url: https://arxiv.org/abs/2511.09794
    published: 2025-11-12
    retrieved: 2026-10-03
    recheck_after: 2027-11-12
    supports: [AO-006]
    status: active
    notes: >-
      Simulating a Waterfall cycle across three different LLMs, multi-agent
      workflows "reorganize, rather than consistently enhance, model
      performance". Direct evidence against assuming that imposing a classic
      process structure on an LLM ensemble produces better results.

