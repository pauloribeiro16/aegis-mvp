  - id: S-080
    key: cognition-dont-build-multi-agents
    title: "Don't Build Multi-Agents"
    org: Cognition (Walden Yan)
    kind: practitioner
    evidence: PRACTITIONER
    url: https://cognition.ai/blog/dont-build-multi-agents
    published: 2025-06-12
    retrieved: 2026-10-03
    recheck_after: 2027-04-03
    supports: [AO-002, AO-006]
    status: active
    quote: >-
      Share context, and share full agent traces, not just individual messages.
    notes: >-
      Opinion from a team shipping a production coding agent, and explicitly
      directional — Cognition sells Devin. Corroborated empirically by
      S-090/S-092/S-093, which is why it is cited rather than dismissed. Second
      principle: "Actions carry implicit decisions, and conflicting decisions
      carry bad results", illustrated by a two-agent decomposition of a Flappy
      Bird clone where the subagents independently made conflicting aesthetic
      decisions and the synthesizer inherited both miscommunications.

  - id: S-081
    key: willison-lethal-trifecta
    title: "The lethal trifecta for AI agents"
    org: Simon Willison
    kind: practitioner
    evidence: PRACTITIONER
    url: https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/
    published: 2025-06-16
    retrieved: 2026-10-03
    recheck_after: 2027-04-03
    supports: [AO-011]
    status: active
    quote: >-
      LLMs follow instructions in content. They don't just follow our
      instructions. They will happily follow any instructions that make it to the
      model, whether or not they came from its operator or from some other
      source.
    notes: >-
      Three co-occurring capabilities make exploitation trivial: access to
      private data, exposure to untrusted content, and ability to communicate
      externally. Practitioner, but consistent with the academic result in
      S-095. His own verdict on guardrail products — confident "95% capture" claims
      are "very much a failing grade" in application security — is the correct
      scepticism to carry into the AEGIS gap analysis.

  - id: S-082
    key: willison-mcp-prompt-injection
    title: "Model Context Protocol has prompt injection security problems"
    org: Simon Willison
    kind: practitioner
    evidence: PRACTITIONER
    url: https://simonwillison.net/2025/Apr/9/mcp-prompt-injection/
    published: 2025-04-09
    retrieved: 2026-10-03
    recheck_after: 2027-04-03
    supports: [AO-011, AO-005]
    status: active
    quote: >-
      MCP tools can mutate their own definitions after installation. You approve a
      safe-looking tool on Day 1, and by Day 7 it's quietly rerouted your API keys
      to an attacker.
    notes: >-
      Rug pull / silent redefinition, cross-server tool shadowing, tool poisoning
      via descriptions, and the confused-deputy pattern from mixing action-capable
      tools with untrusted input. His own conclusion on mitigation is "I don't know
      what to suggest", which is the honest state of the art and the reason
      AO-011 treats this as risk management rather than a solved problem.

