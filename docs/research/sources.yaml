  - id: S-170
    key: prior-review-graphrag
    title: "From Local to Global: A Graph RAG Approach to Query-Focused Summarization"
    org: arXiv
    kind: prior-review
    evidence: PEER
    url: https://arxiv.org/abs/2404.16130
    published: 2024-04-24
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [PP-014, PP-015, KG-001, KG-014, KG-030, KG-033]
    status: active
    quote: >-
      In this manuscript, our analysis uses exact string matching for entity
      matching -- the task of reconciling different extracted names for the same
      entity. However, softer matching approaches can be used with minor
      adjustments to prompts or code. Furthermore, GraphRAG is generally
      resilient to duplicate entities since duplicates are typically clustered
      together for summarization in subsequent steps.
    notes: >-
      From the 2026-10-01 literature review, RE-READ IN FULL on 2026-10-04
      (26-page PDF). Vector RAG fails at corpus-level sensemaking; an LLM-built
      entity graph plus hierarchical community summaries wins on
      comprehensiveness and diversity. The re-read established the load-bearing
      construction detail behind KG-004: the reference implementation resolves
      entities by EXACT STRING MATCH, defended by the claim that duplicates are
      harmless because Leiden clustering groups them anyway. That defence does
      not transfer to a curated corpus where cluster identity is the analytic
      output. Also read for KG-001 (nine-stage indexing pipeline), KG-030
      (community-hierarchy cost: root-level C0 summaries need 9x-43x fewer query
      tokens) and KG-033 (ablations: 8k context beat 16k/32k/64k; 600-token
      extraction chunks yielded ~2x more entity references than 2,400-token
      chunks). Its headline result is CONTRADICTED by S-171 once
      reference-based metrics replace LLM judging -- see C-01.

  - id: S-171
    key: prior-review-rag-vs-graphrag
    title: "RAG vs GraphRAG: A Systematic Evaluation"
    org: arXiv
    kind: prior-review
    evidence: PEER
    url: https://arxiv.org/abs/2502.11371
    published: 2025-02-17
    retrieved: 2026-10-04
    recheck_after: 2027-10-04
    supports: [PP-014, KG-020, KG-021, KG-022, KG-034, KG-035]
    status: active
    quote: >-
      existing GraphRAG systems for text data are often tailored to specific
      tasks, datasets, and system designs, resulting in heterogeneous evaluation
      protocols.
    notes: >-
      From the 2026-10-01 literature review, RE-READ IN FULL on 2026-10-04
      (KDD 2026, DOI 10.1145/3770855.3817575). The de-facto standard
      RAG-vs-GraphRAG reference and the single most important source in this
      research layer. The re-read supplied the numbers the KG catalogue cites
      throughout: NQ F1 RAG 64.78 vs KG-GraphRAG(triplets) 34.28; MultiHop-RAG
      Null queries RAG 96.01 vs Community-GraphRAG(global) 19.27; construction
      135s (RAG) vs 5,560-7,702s (graph). Two findings matter more than the
      rankings: (a) only ~65.8% of HotpotQA answer entities appear in the
      constructed KG -- extraction recall, not reasoning, is the dominant
      failure mode, and it is measurable before a single query runs (KG-022);
      (b) with REFERENCE-based metrics (ROUGE-2, BERTScore) RAG beats
      Community-GraphRAG(global) on all four QFS datasets, reversing S-170's
      judge-scored result. This is the evidence behind ADR-011's
      schema-now-materialise-later decision.

