  - id: S-050
    key: huggingface-transformers-text-generation
    title: "transformers — Text generation"
    org: Hugging Face
    kind: infrastructure-doc
    evidence: PRIMARY
    url: https://huggingface.co/docs/transformers/main/en/main_classes/text_generation
    published: 2026
