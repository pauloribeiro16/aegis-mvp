    supports: [PP-008]
    status: active
    notes: >-
      A Python superset language with a where clause for constraints on generated
      spans, plus decoders beyond argmax/sample. Cited to show the design space is
      wider than schema-constrained decoding, not as an AEGIS candidate.

  - id: S-049
    key: cloudflare-code-mode
