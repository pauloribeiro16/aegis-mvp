# ISO/IEC 42001:2023 (AIMS — AI Management System) Annex A — advisory referential spec
# Source: ISO/IEC 42001:2023 Annex A controls.
# https://www.iso.org/standard/81230.html
#
# IDENTIFIER RULE (ADR-2026-10-21): the published Annex A sections run A.2 … A.10.
# Every control below is aligned to the published SECTION whose theme its own text
# carries; the intra-section ordinal is a LOCAL subset ordinal and is not asserted
# to be the published control ordinal. Informative references therefore cite the
# section ("Annex A.2"), never a published control number this file cannot verify
# against the published Annex A.
#
# This corrects a section shift of +3 that was present in the ids themselves
# (A.5–A.10 for content that belongs to A.2–A.7). Coverage: sections A.2–A.8 are
# represented. A.9 (Use of AI) and A.10 (Third-party and customer relationships)
# are NOT represented — a coverage gap, not a numbering omission. See
# ADR-2026-10-21 for the defect, the fix and the residual.

framework: "ISO/IEC 42001:2023"
framework_short: "ISO_42001_2023"
directory: "ISO_42001_2023"
archive: true   # not a pipeline referential (ADR-015 §5)
version: "2023 (Annex A — section-aligned local subset; published control ordinals not asserted)"
source_url: "https://www.iso.org/standard/81230.html"
fetched_date: "2026-09-22"

families:
  # ---- A.2 Policies related to AI ----
  - function: "A2"
    function_dir: "A2_POLICIES"
    category_name: "Policies for AI"
    practices:
      - id: "A.2.1"
        text: "Define an AI policy aligned with the organisation's purpose and applicable laws, and approve at the appropriate level."
        informative_references: ["ISO/IEC 42001:2023 Annex A.2", "NIST AI RMF 1.0: GOVERN-1.1"]
        examples: ["Documented AI policy"]
        objectives: ["Determine whether an AI policy exists."]
      - id: "A.2.2"
        text: "Define AI principles (fairness, transparency, accountability, safety) that guide AI development and use."
        informative_references: ["ISO/IEC 42001:2023 Annex A.2", "NIST AI RMF 1.0: GOVERN-1.2"]
        examples: ["AI principles charter"]
        objectives: ["Determine whether AI principles are defined."]

  # ---- A.3 Internal organization ----
  - function: "A3"
    function_dir: "A3_INTERNAL_ORG"
    category_name: "Internal Organization for AI"
    practices:
      - id: "A.3.1"
        text: "Define AI-specific roles, responsibilities, and authorities (incl. AI ethics committee)."
        informative_references: ["ISO/IEC 42001:2023 Annex A.3", "NIST AI RMF 1.0: GOVERN-2.1"]
        examples: ["Roles per AI system"]
        objectives: ["Determine whether AI-specific roles exist."]
      - id: "A.3.2"
        text: "Maintain oversight of the AIMS by top management (review, decisions, accountability)."
        informative_references: ["ISO/IEC 42001:2023 Annex A.3", "NIST AI RMF 1.0: GOVERN-2.2"]
        examples: ["AIMS management review"]
        objectives: ["Determine whether top management oversees the AIMS."]
      - id: "A.3.3"
        text: "Segregate AI development from business functions where appropriate to manage conflicts of interest."
        informative_references: ["ISO/IEC 42001:2023 Annex A.3"]
        examples: ["Independent review"]
        objectives: ["Determine whether AI dev is appropriately segregated."]
      - id: "A.3.4"
        text: "Establish an AI risk-management process including identification, assessment, treatment, and monitoring."
        informative_references: ["ISO/IEC 42001:2023 Annex A.3", "NIST AI RMF 1.0: GOVERN-4.1"]
        examples: ["AI risk register"]
        objectives: ["Determine whether AI risks are managed."]
      - id: "A.3.5"
        text: "Define a process for AI ethics review including bias, fairness, and societal impact."
        informative_references: ["ISO/IEC 42001:2023 Annex A.3", "NIST AI RMF 1.0: GOVERN-4.2"]
        examples: ["Ethics review board"]
        objectives: ["Determine whether AI ethics review exists."]
      - id: "A.3.6"
        text: "Document the AI system's accountability chain and human-in/on-the-loop design."
        informative_references: ["ISO/IEC 42001:2023 Annex A.3", "NIST AI RMF 1.0: GOVERN-4.3"]
        examples: ["Accountability documentation"]
        objectives: ["Determine whether the accountability chain is documented."]

  # ---- A.4 Resources ----
  - function: "A4"
    function_dir: "A4_RESOURCES"
    category_name: "Resources for AI"
    practices:
      - id: "A.4.1"
        text: "Allocate resources and budget for the AI management system."
        informative_references: ["ISO/IEC 42001:2023 Annex A.4"]
        examples: ["AIMS budget"]
        objectives: ["Determine whether the AIMS is resourced."]
      - id: "A.4.2"
        text: "Define competence requirements for personnel involved in AI development and deployment."
        informative_references: ["ISO/IEC 42001:2023 Annex A.4", "NIST AI RMF 1.0: GOVERN-2.3"]
        examples: ["AI competence matrix"]
        objectives: ["Determine whether AI competence requirements exist."]
      - id: "A.4.3"
        text: "Provide AI-specific training and awareness to relevant personnel."
        informative_references: ["ISO/IEC 42001:2023 Annex A.4", "NIST AI RMF 1.0: GOVERN-2.3"]
        examples: ["AI training programme"]
        objectives: ["Determine whether AI training is provided."]
      - id: "A.4.4"
        text: "Plan and provision computing and data resources for AI systems."
        informative_references: ["ISO/IEC 42001:2023 Annex A.4", "NIST SP 800-53 Rev 5: SA-02"]
        examples: ["Compute planning"]
        objectives: ["Determine whether AI resources are planned."]

  # ---- A.5 Assessing impacts ----
  - function: "A5"
    function_dir: "A5_IMPACT"
    category_name: "Assessing Impacts"
    practices:
      - id: "A.5.1"
        text: "Conduct AI impact assessments before deployment, including individual, societal, and environmental impacts."
        informative_references: ["ISO/IEC 42001:2023 Annex A.5", "NIST AI RMF 1.0: MAP-5.1"]
        examples: ["AIA reports"]
        objectives: ["Determine whether impact assessments are performed."]
      - id: "A.5.2"
        text: "Assess AI impacts on data subjects' rights and freedoms, including privacy and non-discrimination."
        informative_references: ["ISO/IEC 42001:2023 Annex A.5", "GDPR Art. 35"]
        examples: ["Fundamental rights impact assessment"]
        objectives: ["Determine whether data-subject impact is assessed."]
      - id: "A.5.3"
        text: "Apply controls to address identified AI risks per the risk treatment plan."
        informative_references: ["ISO/IEC 42001:2023 Annex A.5", "NIST AI RMF 1.0: GOVERN-4.3"]
        examples: ["Risk treatment"]
        objectives: ["Determine whether AI risks are treated."]

  # ---- A.6 AI system life cycle ----
  - function: "A6"
    function_dir: "A6_LIFECYCLE"
    category_name: "AI System Life Cycle"
    practices:
      - id: "A.6.1"
        text: "Document the AI system's intended purpose, scope, and stakeholders before development."
        informative_references: ["ISO/IEC 42001:2023 Annex A.6", "NIST AI RMF 1.0: MAP-1.1"]
        examples: ["AI system statement of purpose"]
        objectives: ["Determine whether the AI system's purpose is documented."]
      - id: "A.6.2"
        text: "Manage AI system requirements including functional, performance, ethical, and regulatory requirements."
        informative_references: ["ISO/IEC 42001:2023 Annex A.6", "NIST AI SSDF: PO.AI.1"]
        examples: ["AI requirements specification"]
        objectives: ["Determine whether AI requirements are managed."]
      - id: "A.6.3"
        text: "Validate AI system design with respect to requirements, fairness, robustness, and safety."
        informative_references: ["ISO/IEC 42001:2023 Annex A.6", "NIST AI SSDF: PW.AI.1"]
        examples: ["Design validation"]
        objectives: ["Determine whether AI design is validated."]
      - id: "A.6.4"
        text: "Apply secure-by-design principles to AI systems (model and pipeline security)."
        informative_references: ["ISO/IEC 42001:2023 Annex A.6", "NIST AI SSDF: PS.AI.4"]
        examples: ["Secure-AI design reviews"]
        objectives: ["Determine whether secure-by-design is applied to AI."]
      - id: "A.6.5"
        text: "Manage AI training and development including data preparation, model training, and validation."
        informative_references: ["ISO/IEC 42001:2023 Annex A.6", "NIST AI SSDF: PW.AI.4"]
        examples: ["Training runbook"]
        objectives: ["Determine whether AI training is managed."]
      - id: "A.6.6"
        text: "Test AI systems for accuracy, robustness, bias, and adversarial resistance before deployment."
        informative_references: ["ISO/IEC 42001:2023 Annex A.6", "NIST AI SSDF: PW.AI.3"]
        examples: ["Pre-deployment test suite"]
        objectives: ["Determine whether AI systems are tested pre-deployment."]
      - id: "A.6.7"
        text: "Maintain documentation for AI models including architecture, lineage, and dependencies."
        informative_references: ["ISO/IEC 42001:2023 Annex A.6", "NIST AI RMF 1.0: MAP-4.1"]
        examples: ["Model card", "Lineage tracking"]
        objectives: ["Determine whether AI model documentation is maintained."]
      - id: "A.6.8"
        text: "Apply AI-specific configuration management to model artefacts and pipelines."
        informative_references: ["ISO/IEC 42001:2023 Annex A.6", "NIST AI SSDF: PW.AI.5"]
        examples: ["Model registry"]
        objectives: ["Determine whether AI configurations are managed."]
      - id: "A.6.9"
        text: "Deploy AI systems with appropriate change management, release controls, and rollback plans."
        informative_references: ["ISO/IEC 42001:2023 Annex A.6", "NIST SSDF v1.1: PS.3.1"]
        examples: ["AI deployment runbook"]
        objectives: ["Determine whether AI deployment is controlled."]
      - id: "A.6.10"
        text: "Document and apply AI-specific operational procedures and playbooks."
        informative_references: ["ISO/IEC 42001:2023 Annex A.6"]
        examples: ["AI operational procedures"]
        objectives: ["Determine whether AI operating procedures exist."]
      - id: "A.6.11"
        text: "Operate and monitor AI systems in production with KPIs, drift detection, and incident handling."
        informative_references: ["ISO/IEC 42001:2023 Annex A.6", "NIST AI RMF 1.0: MANAGE-2.4"]
        examples: ["Model monitoring"]
        objectives: ["Determine whether AI operations include monitoring."]
      - id: "A.6.12"
        text: "Manage AI model retirement, replacement, and end-of-life securely and ethically."
        informative_references: ["ISO/IEC 42001:2023 Annex A.6", "NIST AI SSDF: RV.AI.3"]
        examples: ["Model retirement process"]
        objectives: ["Determine whether AI retirement is managed."]
      - id: "A.6.13"
        text: "Apply AI-specific version control and change management for models, data, and configurations."
        informative_references: ["ISO/IEC 42001:2023 Annex A.6", "NIST SSDF v1.1: PS.1.1"]
        examples: ["Model version control"]
        objectives: ["Determine whether AI version control is applied."]

  # ---- A.7 Data for AI systems ----
  - function: "A7"
    function_dir: "A7_DATA"
    category_name: "Data for AI Systems"
    practices:
      - id: "A.7.1"
        text: "Define and enforce data quality requirements appropriate to the AI use case (accuracy, completeness, timeliness)."
        informative_references: ["ISO/IEC 42001:2023 Annex A.7", "NIST AI RMF 1.0: MAP-2.1"]
        examples: ["Data quality SLAs"]
        objectives: ["Determine whether data quality requirements exist."]
      - id: "A.7.2"
        text: "Document data origin, provenance, and lineage for training, validation, and inference datasets."
        informative_references: ["ISO/IEC 42001:2023 Annex A.7", "NIST AI SSDF: PS.AI.2"]
        examples: ["Data lineage graph"]
        objectives: ["Determine whether data lineage is documented."]
      - id: "A.7.3"
        text: "Apply data privacy and protection controls (consent, lawful basis, minimisation) to AI datasets."
        informative_references: ["ISO/IEC 42001:2023 Annex A.7", "GDPR Art. 6, 9", "ISO/IEC 27701:2019"]
        examples: ["Consent capture", "Minimisation"]
        objectives: ["Determine whether privacy is applied to AI data."]
      - id: "A.7.4"
        text: "Apply data security controls (encryption, access controls, integrity) to AI datasets and artefacts."
        informative_references: ["ISO/IEC 42001:2023 Annex A.7", "NIST SP 800-53 Rev 5: SC-28"]
        examples: ["Dataset encryption"]
        objectives: ["Determine whether data security is applied to AI data."]

  # ---- A.8 Information for interested parties ----
  - function: "A8"
    function_dir: "A8_TRANSPARENCY"
    category_name: "Information for Interested Parties"
    practices:
      - id: "A.8.1"
        text: "Define and apply transparency and explainability controls appropriate to the use case."
        informative_references: ["ISO/IEC 42001:2023 Annex A.8", "NIST AI RMF 1.0: MEASURE-2.8"]
        examples: ["User disclosures"]
        objectives: ["Determine whether transparency controls are applied."]
