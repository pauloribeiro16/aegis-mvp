# aegis-mvp configuration
#
# All corpus locations are REFERENCES into the frozen AEGIS baseline inside
# Methodology_compact (read-only; never copy, never write). Paths are relative
# to this repository root. Override in a local config.local.yaml if the
# methodology repo lives elsewhere.

corpus:
  # Frozen baseline corpus root (38 sub-domains D-XX.Y + article copies + NIST/OWASP referentials)
  root: "../Methodology_compact/00_METHODOLOGY/PREPROCESSING_by_domain"
  # Sub-domain corpus: domains/D-0X_Name/D-XX.Y/D-XX.Y.md (merged Parts 1-4) + articles/
  domains: "../Methodology_compact/00_METHODOLOGY/PREPROCESSING_by_domain/domains"
  # Control referentials: NIST_CSF_2.0, NIST_PF, NIST_AI_RMF, NIST_80053R5, NIST_SSDF, OWASP_ASVS, OWASP_SAMM
  controls: "../Methodology_compact/00_METHODOLOGY/PREPROCESSING_by_domain/CONTROLS"
  # Domain index (10 domains, 38 sub-domains)
  domains_index: "../Methodology_compact/00_METHODOLOGY/PREPROCESSING_by_domain/domains/index.md"

ambiguity_registry:
  # Canonical cross-case ambiguity baseline (49 clause cards); per-clause citations
  # must point here, not be re-derived
  path: "../Methodology_compact/00_METHODOLOGY/AMBIGUITY_REGISTRY/registry.md"

pipeline:
  # Output language for generated documents
  output_language: "en"
  # Objective ID scheme: AG-D-XX.Y-NNN (sequential per sub-domain within a run)
  objective_id_prefix: "AG"
